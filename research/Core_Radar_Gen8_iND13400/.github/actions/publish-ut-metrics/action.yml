name: Publish Unit Test Metrics
description: Parse unit test coverage outputs and emit normalized metrics payload for nightly publishing.

inputs:
  variant:
    description: Unit test variant tag, e.g. flr8 or srr8p
    required: true
  report-txt:
    description: Path to gcovr text report
    required: false
    default: bazel-bin/coverage/report.txt
  gcovr-json:
    description: Path to gcovr JSON report
    required: false
    default: bazel-bin/coverage/report_gcovr_report.json
  true-count-json:
    description: Path to true-count JSON report
    required: false
    default: bazel-bin/coverage/ut_true_count_report.json
  output-file:
    description: Output JSONL file path for generated metrics
    required: false
    default: unit-test-metrics.jsonl
  preview-limit:
    description: Maximum number of metric rows to print as dry-run preview
    required: false
    default: '25'
  db-publish-enabled:
    description: When true, attempt PostgreSQL publish from generated JSONL
    required: false
    default: 'false'
  metrics-db-user:
    description: PostgreSQL username
    required: false
    default: ''
  metrics-db-password:
    description: PostgreSQL password
    required: false
    default: ''
  metrics-db-host:
    description: PostgreSQL host
    required: false
    default: ''
  metrics-db-port:
    description: PostgreSQL port
    required: false
    default: ''
  metrics-db-name:
    description: PostgreSQL database name
    required: false
    default: ''
  commit-id:
    description: Commit SHA or identifier for CommitId column
    required: false
    default: ''
  branch:
    description: Branch name for branch column
    required: false
    default: ''
  project-name:
    description: Project name for project column
    required: false
    default: ''
  tag:
    description: Tag column value
    required: false
    default: ''
  pipeline-name:
    description: Pipeline/workflow name used in perception_metrics_wrsd
    required: false
    default: ''
  build-no:
    description: Pipeline run number used in perception_metrics_wrsd
    required: false
    default: ''
  build-url:
    description: URL for this workflow run
    required: false
    default: ''

outputs:
  metric-count:
    description: Number of generated metric rows
    value: ${{ steps.generate.outputs.metric-count }}
  output-file:
    description: Absolute path to generated metrics file
    value: ${{ steps.generate.outputs.output-file }}

runs:
  using: composite
  steps:
    - name: Generate unit test metrics payload
      id: generate
      shell: bash
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        import re
        import sys
        from pathlib import Path

        variant = os.environ["VARIANT"]
        report_txt = Path(os.environ["REPORT_TXT"])
        gcovr_json = Path(os.environ["GCOVR_JSON"])
        true_count_json = Path(os.environ["TRUE_COUNT_JSON"])
        output_file = Path(os.environ["OUTPUT_FILE"])
        preview_limit = int(os.environ.get("PREVIEW_LIMIT", "25"))

        def to_float(value):
          try:
            return float(value)
          except Exception:
            return None

        def parse_report_txt(path: Path):
          result = {
            "line": None,
            "decision": None,
            "function": None,
            "branch": None,
            "untested": None,
          }
          if not path.is_file():
            return result

          with path.open("r", encoding="utf-8", errors="ignore") as f:
            lines = f.readlines()

          coverage_row = None
          for line in lines:
            if "//coverage:report" in line:
              coverage_row = line
              break

          if coverage_row:
            nums = re.findall(r"[0-9]+(?:\.[0-9]+)?", coverage_row)
            if len(nums) >= 8:
              result["line"] = to_float(nums[0])
              result["decision"] = to_float(nums[2])
              result["function"] = to_float(nums[4])
              result["branch"] = to_float(nums[6])

          for line in lines:
            m = re.search(r"Untested source files \(([0-9]+)\)", line)
            if m:
              result["untested"] = to_float(m.group(1))
              break

          return result

        def parse_gcovr_json(path: Path):
          if not path.is_file():
            return None
          with path.open("r", encoding="utf-8") as f:
            return json.load(f)

        def parse_true_count_json(path: Path):
          if not path.is_file():
            return None
          with path.open("r", encoding="utf-8") as f:
            return json.load(f)

        def append_ut_summary_metrics(rows, summary):
          mapping = [
            ("BranchCoverage", summary.get("branch")),
            ("DecisionCoverage", summary.get("decision")),
            ("LineCoverage", summary.get("line")),
            ("FunctionCoverage", summary.get("function")),
            ("UntestedFiles", summary.get("untested")),
          ]
          for category, value in mapping:
            if value is None:
              continue
            rows.append(
              {
                "metric_name": "core_radar.gen8.unittest",
                "metric_value": value,
                "metric_tags": {"variant": variant, "category": category},
              }
            )

        def append_ut_detail_metrics(rows, gcovr_data):
          if not gcovr_data:
            return

          overall_map = [
            ("overall_branch_covered", "branch_covered"),
            ("overall_branch_total", "branch_total"),
            ("overall_decision_covered", "decision_covered"),
            ("overall_decision_total", "decision_total"),
            ("overall_function_covered", "function_covered"),
            ("overall_function_total", "function_total"),
            ("overall_line_covered", "line_covered"),
            ("overall_line_total", "line_total"),
          ]

          for category, key in overall_map:
            if key in gcovr_data:
              value = to_float(gcovr_data.get(key))
              if value is not None:
                rows.append(
                  {
                    "metric_name": "core_radar.gen8.unittest.details",
                    "metric_value": value,
                    "metric_tags": {"variant": variant, "category": category},
                  }
                )

          file_map = [
            ("branch_covered", "branch_covered"),
            ("branch_total", "branch_total"),
            ("decision_covered", "decision_covered"),
            ("decision_total", "decision_total"),
            ("function_covered", "function_covered"),
            ("function_total", "function_total"),
            ("line_covered", "line_covered"),
            ("line_total", "line_total"),
          ]

          for entry in gcovr_data.get("files", []):
            filename = entry.get("filename")
            if not filename:
              continue
            for category, key in file_map:
              if key not in entry:
                continue
              value = to_float(entry.get(key))
              if value is None:
                continue
              rows.append(
                {
                  "metric_name": "core_radar.gen8.unittest.details",
                  "metric_value": value,
                  "metric_tags": {
                    "variant": variant,
                    "category": category,
                    "filename": filename,
                  },
                }
              )

        def append_ut_true_count_metrics(rows, true_count_data):
          if not true_count_data:
            return
          for filename, values in true_count_data.items():
            if filename in ("total_true", "total_false", "total_tests", "total_coverage"):
              continue
            true_count = to_float(values.get("True Count", 0))
            total_count = to_float(values.get("Total", 0))
            if true_count is not None:
              rows.append(
                {
                  "metric_name": "core_radar.gen8.unittest.true_count",
                  "metric_value": true_count,
                  "metric_tags": {
                    "variant": variant,
                    "category": "true_count",
                    "filename": filename,
                  },
                }
              )
            if total_count is not None:
              rows.append(
                {
                  "metric_name": "core_radar.gen8.unittest.true_count",
                  "metric_value": total_count,
                  "metric_tags": {
                    "variant": variant,
                    "category": "total_count",
                    "filename": filename,
                  },
                }
              )

        rows = []
        summary = parse_report_txt(report_txt)
        gcovr_data = parse_gcovr_json(gcovr_json)
        true_count_data = parse_true_count_json(true_count_json)

        append_ut_summary_metrics(rows, summary)
        append_ut_detail_metrics(rows, gcovr_data)
        append_ut_true_count_metrics(rows, true_count_data)

        output_file.parent.mkdir(parents=True, exist_ok=True)
        with output_file.open("w", encoding="utf-8") as out:
          for row in rows:
            out.write(json.dumps(row, sort_keys=True) + "\n")

        print(f"Generated {len(rows)} metric row(s) at {output_file.resolve()}")

        if rows:
          metric_name_counts = {}
          for row in rows:
            metric_name = row.get("metric_name", "unknown")
            metric_name_counts[metric_name] = metric_name_counts.get(metric_name, 0) + 1

          print("[dry-run] Metric row counts by metric_name:")
          for name in sorted(metric_name_counts.keys()):
            print(f"[dry-run]   {name}: {metric_name_counts[name]}")

          if preview_limit > 0:
            print(f"[dry-run] Showing first {min(preview_limit, len(rows))} row(s):")
            for idx, row in enumerate(rows[:preview_limit], start=1):
              print(f"[dry-run] {idx:03d}: {json.dumps(row, sort_keys=True)}")

            if len(rows) > preview_limit:
              print(f"[dry-run] ... {len(rows) - preview_limit} additional row(s) not shown")
        else:
          print("[dry-run] No metric rows generated")

        github_output = os.environ.get("GITHUB_OUTPUT")
        if not github_output:
          sys.exit(1)

        with open(github_output, "a", encoding="utf-8") as fh:
          fh.write(f"metric-count={len(rows)}\n")
          fh.write(f"output-file={output_file.resolve()}\n")
        PY
      env:
        VARIANT: ${{ inputs.variant }}
        REPORT_TXT: ${{ inputs.report-txt }}
        GCOVR_JSON: ${{ inputs.gcovr-json }}
        TRUE_COUNT_JSON: ${{ inputs.true-count-json }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        PREVIEW_LIMIT: ${{ inputs.preview-limit }}

    - name: Publish metrics to PostgreSQL
      if: ${{ inputs.db-publish-enabled == 'true' && steps.generate.outputs.metric-count != '0' && inputs.metrics-db-user != '' && inputs.metrics-db-password != '' && inputs.metrics-db-host != '' && inputs.metrics-db-port != '' && inputs.metrics-db-name != '' }}
      uses: ./.github/actions/publish-jsonl-to-postgres
      with:
        metrics-file: ${{ steps.generate.outputs.output-file }}
        metrics-db-user: ${{ inputs.metrics-db-user }}
        metrics-db-password: ${{ inputs.metrics-db-password }}
        metrics-db-host: ${{ inputs.metrics-db-host }}
        metrics-db-port: ${{ inputs.metrics-db-port }}
        metrics-db-name: ${{ inputs.metrics-db-name }}
        commit-id: ${{ inputs.commit-id }}
        branch: ${{ inputs.branch }}
        project-name: ${{ inputs.project-name }}
        tag: ${{ inputs.tag }}
        pipeline-name: ${{ inputs.pipeline-name }}
        build-no: ${{ inputs.build-no }}
        build-url: ${{ inputs.build-url }}

    - name: Note skipped DB publish
      if: ${{ inputs.db-publish-enabled == 'true' && (inputs.metrics-db-user == '' || inputs.metrics-db-password == '' || inputs.metrics-db-host == '' || inputs.metrics-db-port == '' || inputs.metrics-db-name == '') }}
      shell: bash
      run: |
        echo "::notice::METRICS_DB_USER/METRICS_DB_PASSWORD/METRICS_DB_HOST/METRICS_DB_PORT/METRICS_DB_NAME are not configured; skipping PostgreSQL metrics publish."
