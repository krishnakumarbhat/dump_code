# SWE6 nightly trigger for the SRR8P family.
# Thin wrapper around the generic reusable workflow (radar-test-reusable.yml).

name: SWE6 SRR8P Nightly

on:
  workflow_dispatch:
    inputs:
      build-all-run-id:
        description: 'build-all.yml run ID whose combined-outputs to use'
        required: true
      variant:
        description: 'Variant to run (auto = daily rotation)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - srr8p_standalone
          - srr8p_al_can_standalone
          - srr8p_satellite_can
          - srr8p_satellite_eth_high_det
      xcp:
        description: 'XCP transport (auto = the one paired with the selected variant)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - CAN
          - Eth_Direct
      variant-custom:
        description: 'Custom variant name -- overrides the variant dropdown when non-empty'
        required: false
        default: ''
      xcp-custom:
        description: 'Custom XCP transport -- overrides the xcp dropdown when non-empty'
        required: false
        default: ''
      extra-args:
        description: 'Extra arguments appended to Run_Test_Cases.bat'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  swe6-srr8p:
    name: SWE6 SRR8P
    uses: ./.github/workflows/radar-test-reusable.yml
    with:
      job-type: SWE6
      family: SRR8P
      test-folder: SWE6_Testing
      rotation-strategy: daily
      variant-override: ${{ inputs.variant-custom != '' && inputs.variant-custom || (inputs.variant != 'auto' && inputs.variant) || '' }}
      xcp-override: ${{ inputs.xcp-custom != '' && inputs.xcp-custom || (inputs.xcp != 'auto' && inputs.xcp) || '' }}
      extra-args: ${{ inputs.extra-args }}
      job-url: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/swe6-srr8p.yml
      gh-artifact-name: 'combined-outputs'
      gh-artifact-workflow: 'build-all.yml'
      gh-artifact-branch: ${{ github.ref_name }}
      gh-artifact-run-id: ${{ inputs.build-all-run-id }}
      runner-labels: '["self-hosted","windows","ADVRADAR-GEN8-SWE6"]'
      test-matrix-json: |
        [
          {"variant":"srr8p_standalone",             "xcp":"Eth_Direct"},
          {"variant":"srr8p_al_can_standalone",      "xcp":"CAN"},
          {"variant":"srr8p_al_can_standalone",      "xcp":"Eth_Direct"},
          {"variant":"srr8p_satellite_can",          "xcp":"CAN"},
          {"variant":"srr8p_satellite_can",          "xcp":"Eth_Direct"},
          {"variant":"srr8p_satellite_eth_high_det", "xcp":"Eth_Direct"}
        ]
      email-recipients: ${{ vars.ADVRADAR_EMAIL_RECIPIENTS }}
    secrets: inherit
