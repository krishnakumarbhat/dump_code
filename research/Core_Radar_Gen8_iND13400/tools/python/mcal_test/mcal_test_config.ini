# MCAL Test Automation Configuration File
# Edit paths below to match your build output location
# NOTE: Build must be done manually before running tests

[Paths]
# Path to R52 ELF file (supports absolute or relative paths)
# Use forward slashes (/) or double backslashes (\\)
r52_elf = C:/Jagadish/Core_Radar_Gen8_iND13400/bazel-bin/outputs/flr8_satellite_can/r52App.elf

# Path to flash session INI file
# If not specified, will look for flash_session.ini in same directory as ELF
flash_session = C:/Jagadish/Core_Radar_Gen8_iND13400/bazel-bin/outputs/flr8_satellite_can/flash_session.ini

# Output directory for test reports
output_dir = C:/Jagadish/Core_Radar_Gen8_iND13400/Mcal_test_report

[Trace32]
# Trace32 installation path (will be auto-detected if not specified)
# t32_executable = C:\\T32\\bin\\windows64\\t32marm.exe

# Trace32 Remote API settings
port = 20000
packlen = 1024

[Options]
# Auto-flash mode: automatically launch Trace32 and flash software
auto_flash = true

# Open HTML report in browser after completion
open_report = true
