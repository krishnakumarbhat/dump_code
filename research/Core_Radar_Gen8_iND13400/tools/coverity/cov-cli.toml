# Note that ALL paths are relative to project root.
[cov-cli]
min_version = "2.13.0"

[coverity]
version = "2023.6.0"
host = "coverity.asux.aptiv.com"
port = 443
ssl = true
# do not forget to add this dir to .gitignore/ignore.conf
dir = "covdir"
# config generated by cov-configure
compiler_config = "tools/coverity/config/coverity_config.xml"
# EXAMPLE:
# cov-build $build_flags
build_flags = "--emit-complementary-info --return-emit-failures --parse-error-threshold 95"
# cov-analyze $analyze_flags
analyze_flags = "--hfa --enable-default --enable-callgraph-metrics --enable-fnptr --enable-virtual --enable-constraint-fpp --security --concurrency --checker-option DEADCODE:no_dead_default:true --checker-option RESOURCE_LEAK:allow_main:true --checker-option UNUSED_VALUE:report_unused_initializer:true"
# cov-run-desktop $run_desktop_flags
run_desktop_flags = "--set-new-defect-owner false"

# if any of checkers in the list is found in deviated checkers (the list in .config file),
# they will be forcefully enabled (removed from deviated list).
enable_checkers = [
  "Rule-2.7",
  "Rule-8.7",
  "Rule-8.9",
  "Rule-12.4",
  "Directive-4.2",
  "Directive-4.13"
]

[[targets]]
name = "srr8_bbe32_misrac"
type = "C"
stream = "CORERDR0_Gen8_iND13400_SRR8_BBE32"
# bazel_target = "//software/bbe32/example:bbeExampleApp"
output_tag = "_misrac"
tu_pattern = "file('.c$|.i$')"
coding_standard_files = [
  "tools/coverity/coding-standards/misrac2012/misrac2012-all.config"
]
cov_analyze_flags = "--hfa --enable-fnptr --enable-virtual --enable-constraint-fpp --enable-default --security --concurrency --enable-parse-warnings --checker-option RESOURCE_LEAK:allow_main:true --checker-option MISSING_RETURN:only_one_return:true --checker-option UNUSED_VALUE:report_unused_initializer:true"

