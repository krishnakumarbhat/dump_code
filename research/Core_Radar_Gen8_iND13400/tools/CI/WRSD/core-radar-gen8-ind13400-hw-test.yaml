      - name: publish
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3

          import subprocess
          import sys
          import os
          import zipfile
          import re
          import json

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")

          if TARGET not in sys.path:
            sys.path.insert(0, TARGET)

          def install_deps_and_restart():
            subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--break-system-packages",
              "--no-cache-dir",
              "--target", TARGET,
              "psycopg2-binary"
            ])

            os.makedirs(TARGET, exist_ok=True)
            with open(MARKER, "w", encoding="utf-8"):
              pass

            os.execv(sys.executable, [sys.executable] + sys.argv)

          if not os.path.exists(MARKER):
            print("Installing Python dependencies...")
            install_deps_and_restart()

          import psycopg2

          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def insert_wrsd_tags(cursor, wrsd_tags):
            """
            Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd.
            """
            # Check if the wrsd_tags entry already exists
            cursor.execute("""
                SELECT id FROM wrsd."perception_metrics_wrsd"
                WHERE build_no = %s AND pipeline_name = %s;
            """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
            result = cursor.fetchone()
            # If exists, return id, else insert new and return new id
            if result:
              print("WRSD entry already exists")
              return result[0]
            else:
              print("Creating a new WRSD entry")

              cursor.execute("""
                  INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                  VALUES (%s, %s, %s, %s, %s) RETURNING id;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
              result = cursor.fetchone()[0]

              return result

          def insert_perception_metrics(cursor, data_list):
            """
            Inserts multiple perception_metrics entries into the database.

            Parameters:
                data_list (list of dict): List of dictionaries, each containing data for a single entry.
            """
            for data in data_list:
              # First, insert or get the wrsd_tags ID
              wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])

              # Insert into PerceptionMetrics with reference to wrsd_id
              cursor.execute("""
                  INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                  VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
              """, (
                  data['commitid'],
                  data['date'],
                  data['branch'],
                  data['tag'],
                  data['project'],
                  data['metric_name'],
                  data['metric_value'],
                  Json(data['metric_tags']),
                  wrsd_id
              ))

          def read_file(file_path):
            """Read and return the contents of a file."""
            with open(os.path.expandvars(file_path), 'r') as file:
              return file.read().strip()

          def get_json_file(destination_path, variant):
            """Find and extract json file from a ZIP file."""
            json_file = f"{variant}_platformHealth.json"
            print(f"json_file: {json_file}")

            os.chdir(destination_path)
            current_path = os.getcwd()
            print(f"Current directory: {current_path}")

            # List contents of the current directory
            contents = os.listdir('.')

            # Find the ZIP file
            zip_file = [file for file in contents if file.endswith('.zip')]

            if zip_file:
              zip_file_path = zip_file[0]  # Take the first ZIP file
              print(f"Unzipping {zip_file_path}...")

              # Create an extraction folder
              extract_folder = os.path.splitext(zip_file_path)[0]  # Remove the .zip extension
              os.makedirs(extract_folder, exist_ok=True)

              # Unzip the file
              with zipfile.ZipFile(zip_file_path, 'r') as zip_ref:
                zip_ref.extractall(extract_folder)

              print(f"Extracted to: {extract_folder}")

              for root,dirs,files in os.walk(extract_folder):
                print(files)
                if json_file in files:
                  print(f"Found files: {json_file}")
                  return (os.path.join(root,json_file))
            else:
              print("No ZIP files found in the current directory.")

            return None

          def parse_smoke_test_results(file_path):
            """Parse smoke test resuts from the <variant>_platformHealth.json file."""
            try:
              with open(file_path, 'r') as file:
                  data = json.load(file)
              print(data)
              return data
            except FileNotFoundError:
              print(f"Error: File {file_path} not found.")
            except json.JSONDecodeError as e:
              print(f"Error parsing JSON: {e}")
            except Exception as e:
              print(f"Unexpected error: {e}")

          def parse_flash_memory(file_path):
            """Parse flash memory statistics from flash_memory_stats.txt."""
            flash_memory = []
            with open(file_path, 'r') as file:
              for line in file:
                # Parse utilization lines
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)%\s+-\s+([\d.]+)\s+MB\s+of\s+([\d.]+)\s+MB", line
                )
                if match:
                  name, percentage, used_mb, total_mb = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'percentage': float(percentage),
                    'used_mb': float(used_mb),
                    'total_mb': float(total_mb)
                  })
                  continue

                # Parse total lines and addressed sections
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)\s+KB\s+over\s+([\d.]+)\s+KB\s+span\s*\(\s*([\d.]+)%\s*\)\s+-\s+0x([\da-fA-F]+)\s+to\s+0x([\da-fA-F]+)",
                  line
                )
                if match:
                  name, used_kb, span_kb, percentage, start_address, end_address = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'used_kb': float(used_kb),
                    'span_kb': float(span_kb),
                    'percentage': float(percentage),
                    'start_address': f"0x{start_address}",
                    'end_address': f"0x{end_address}"
                  })
                  continue

                # Parse individual flash sections
                match = re.match(
                  r"^\s*(\S.*?):\s+([\d.]+)\s+KB\s+over\s+([\d.]+)\s+KB\s+span\s+\(([\d.]+)%\)", line
                )
                if match:
                  name, used_kb, span_kb, percentage = match.groups()
                  flash_memory.append({
                    'name': name.strip(),
                    'used_kb': float(used_kb),
                    'span_kb': float(span_kb),
                    'percentage': float(percentage)
                  })

                  continue

            return flash_memory

          def package_data_for_postgresql(base_data, variant, smoke_test_values):
            """Package parsed data into a list for database insertion."""
            data_list = []

            # smoke test results
            for values in smoke_test_values:
              data_list.append({
                **base_data,
                "metric_name": values["metricName"],
                "metric_tags": values["metricTags"] ,
                "metric_value": float(values["metricValue"]),
              })

            return data_list

            # Memory Sections
            for section in memory_sections:
              metric_name = "core_radar.gen8.memoryStats.sections"
              metric_tags = {"section": section["section_name"], "variant": variant}
              data_list.append({
                **base_data,
                "metric_name": metric_name,
                "metric_tags": {**metric_tags, "type": "total_kb"},
                "metric_value": float(section["total_kb"]),
              })
              data_list.append({
                **base_data,
                "metric_name": metric_name,
                "metric_tags": {**metric_tags, "type": "used_kb"},
                "metric_value": float(section["used_kb"]),
              })

            # Module Breakdown
            for module in module_breakdown:
              metric_name = "core_radar.gen8.memoryStats.modules"
              metric_tags = {"module": module["module_name"], "variant": variant}
              data_list.extend([
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "code_kb"},
                  "metric_value": float(module["code_kb"]),
                },
                {
                  **base_data,
                  "metric_name": metric_name,
                  "metric_tags": {**metric_tags, "type": "data_kb"},
