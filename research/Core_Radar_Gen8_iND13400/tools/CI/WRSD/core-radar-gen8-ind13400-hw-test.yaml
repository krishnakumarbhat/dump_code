langVersion: v1
name: core-radar-gen8-ind13400-hw-test
description: Pipeline that flashes the software and runs a smoke test on all variants of the code for Gen8 ind13400
ui:
  name: core-radar-gen8-ind13400-hw-test
params:
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: dev
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen8_iND13400
  - name: upload-path
    type: string
    description: |-
      The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the repository
      Ex. core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/manual/hw-test/$(config.pipeline.runNumber)
    default: core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/manual/hw-test/$(config.pipeline.runNumber)
    ui:
      name: JFrog Upload Path
  - name: download-path
    type: string
    description: |-
      The path inside of JFrog to download the outputs from. Note - this does not include the base URL of the JFrog Artifactory
      Ex. core_radar-aptiv-00000000-gen8_ind13400-local/reviews/45/12345/6/buildFiles/
    default: "core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/manual/0/buildFiles/"
    ui:
      name: JFrog Download Path
  - name: gateway
    type: string
    default: perceptionGateway
  - name: group-name
    type: string
    default: core_radar_gen8_cicd
  - name: branch
    type: string
    default: dev
  - name: change-url
    type: string
    default: ""
  - name: patchset-number
    type: string
    default: ""
  - name: testTimeout
    type: string
    default: "10m"
    description: |-
      Timeout of the smoke test stage in case there is an issue. Needs "m" or "h" at the end.
      Default is 10m, nightly is 20m, and weekly should be 12h
  - name: testDuration
    type: string
    default: "60"
    description: |-
      Duration of the smoke test in seconds. Default is 60 seconds, nightly is 600 (10min), and weekly is 36000 (10hrs)
  - name: overallTimeout
    type: string
    default: "90m"
    description: |-
      Timeout of overall smoke test, this should at least be double the testTime + reserve timeout.
compute:
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
tasks:
  - name: publish-run
    task: Utils/core-radar-publish-run@0.1.1
    compute: linux-1c4g
    timeout: 2m

  - name: pre-gerrit-comment-vote
    task: Utils/ADVRADAR/post-gerrit-comment-vote@1.0.0
    params:
      gerrit-setup: {}
      message: |
        🔔 WRSD Smoke Test job has been added to the queue. [$(config.pipeline.name)_$(config.pipeline.runNumber)](https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber))
      votes:
        Smoke-Test: "0"

  - name: reserve-bench
    task: Utils/core-radar-reserve-bench@0.0.2
    params:
      gateway: $(params.gateway)
      group-name: $(params.group-name)
    timeout: 55m

  - name: smoke-test-flr8
    task: test/smoke-test
    compute: linux-2c8g
    onError: continue
    params:
      variant: flr8
      build-variant: flr8_standalone
      project-name: $(params.project-url-encoded)
      commit-id: $(params.commit-id)
      upload-path: $(params.upload-path)
      download-path: $(params.download-path)standalone/
      comment: flr8_standalone
      gateway: $(params.gateway)
      bench-name: $(tasks.reserve-bench.results.bench-name)
      bench-user: $(tasks.reserve-bench.results.bench-user)
      bench-ip: $(tasks.reserve-bench.results.bench-ip)
      repo-url: "$(params.gerrit-url)/a/$(params.project-url-encoded)"
      testDuration: $(params.testDuration)
      architecture: $(tasks.reserve-bench.results.architecture)
    timeout: $(params.testTimeout)

  - name: smoke-test-srr8p
    task: test/smoke-test
    compute: linux-2c8g
    onError: continue
    params:
      variant: srr8p
      build-variant: srr8p_al_can_standalone
      project-name: $(params.project-url-encoded)
      commit-id: $(params.commit-id)
      upload-path: $(params.upload-path)
      download-path: $(params.download-path)AshokLeyland/
      comment: srr8p_al_can_standalone
      gateway: $(params.gateway)
      bench-name: $(tasks.reserve-bench.results.bench-name)
      bench-user: $(tasks.reserve-bench.results.bench-user)
      bench-ip: $(tasks.reserve-bench.results.bench-ip)
      repo-url: "$(params.gerrit-url)/a/$(params.project-url-encoded)"
      testDuration: $(params.testDuration)
      architecture: $(tasks.reserve-bench.results.architecture)
    timeout: $(params.testTimeout)

  - name: prepare-vote-and-message
    task: Utils/prepare-vote-and-message
    compute: linux-1c4g
    params:
      setup-exit-codes:
        FLR8: $(tasks.smoke-test-flr8.results.setup-exit-code)
        SRR8p: $(tasks.smoke-test-srr8p.results.setup-exit-code)
      download-exit-codes:
        FLR8: $(tasks.smoke-test-flr8.results.download-exit-code)
        SRR8p: $(tasks.smoke-test-srr8p.results.download-exit-code)
      upload-exit-codes:
        FLR8: $(tasks.smoke-test-flr8.results.upload-exit-code)
        SRR8p: $(tasks.smoke-test-srr8p.results.upload-exit-code)
      flash-exit-codes:
        FLR8: $(tasks.smoke-test-flr8.results.flash-exit-code)
        SRR8p: $(tasks.smoke-test-srr8p.results.flash-exit-code)
      smoke-test-exit-codes:
        FLR8: $(tasks.smoke-test-flr8.results.smoke-test-exit-code)
        SRR8p: $(tasks.smoke-test-srr8p.results.smoke-test-exit-code)
      error-messages:
        FLR8: $(tasks.smoke-test-flr8.results.error-message)
        SRR8p: $(tasks.smoke-test-srr8p.results.error-message)

  - name: hw-test-vote
    task: Utils/post-gerrit-comment-vote-flr8@1.1.1
    compute: linux-1c4g
    params:
      gerrit-setup: {}
      message: |-
        $(tasks.prepare-vote-and-message.results.vote-message)

        Build Outputs: [Smoke Test Reports](https://jfrog.asux.aptiv.com/ui/repos/tree/General/$(params.upload-path))
        Build Job: [$(config.pipeline.name)_$(config.pipeline.runNumber)](https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber))
      votes:
        Smoke-Test: $(tasks.prepare-vote-and-message.results.vote-value)
    timeout: 2m

  - parallelTasks:
      - name: publish-metrics-flr8
        when:
        - input: $(params.commit-id)
          operator: in
          values:
            - dev
        - input: $(tasks.smoke-test-flr8.results.upload-exit-code)
          operator: in
          values:
            - "0"
        task: Utils/publish-metrics
        compute: linux-2c8g
        params:
          git-ref: $(params.commit-id)
          change-number : $(params.change-id)
          branch: $(params.branch)
          patchset-number: $(params.patchset-number)
          project-name: $(params.project-url-encoded)
          variant: flr8
          report-files-path: $(tasks.smoke-test-flr8.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen8_iND13400/
          commit-hash: $(tasks.smoke-test-flr8.results.commit-hash)
        timeout: 2m
      - name: publish-metrics-srr8p
        when:
        - input: $(params.commit-id)
          operator: in
          values:
            - dev
        - input: $(tasks.smoke-test-srr8p.results.upload-exit-code)
          operator: in
          values:
            - "0"
        task: Utils/publish-metrics
        compute: linux-2c8g
        params:
          git-ref: $(params.commit-id)
          change-number : $(params.change-id)
          branch: $(params.branch)
          patchset-number: $(params.patchset-number)
          project-name: $(params.project-url-encoded)
          variant: srr8p
          report-files-path: $(tasks.smoke-test-srr8p.results.jf-upload-path)
          destination-path: /workspace/Core_Radar_Gen8_iND13400/
          commit-hash: $(tasks.smoke-test-srr8p.results.commit-hash)
      - name: auto-submit-check
        task: Utils/ADVRADAR/auto-submit@1.0.1
        compute: linux-2c8g
        params:
          project-name: $(params.project-url-encoded)
          change-id: $(params.change-id)
          gerrit-url: $(params.gerrit-url)
          comment: "False"
final:
  - name: unreserve-bench
    task: Utils/core-radar-unreserve-bench@0.0.2
    params:
      bench-name: $(tasks.reserve-bench.results.bench-name)
      target-id: $(tasks.reserve-bench.results.target-id)
    timeout: 1m
    when:
      - input: $(tasks.status)
        operator: in
        values:
          - Completed
          - Succeeded
          - Failed
          - Unstable
defineTasks:
  - name: smoke-test
    langVersion: v1
    category: test
    params:
      - name: commit-id
        type: string
        default: "1234567890"
      - name: project-name
        type: string
        default: $(params.project-name)
      - name: comment
        type: string
        default: ""
        description: |-
          Comment field passed to html report. Can be used for build type, like AshokLeyland or standalone.
      - name: repo-url
        type: string
        description: Project git repo url
        ui:
          name: repo-url
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: flr8
            description: Variant is flr8
            value: flr8
          - name: srr8p
            description: Variant is srr8p
            value: srr8p
        default: flr8
      - name: build-variant
        type: string
        description: The specific build variant to flash and test, this is used to differentiate between different builds of the same variant (like standalone vs satellite)
        default: ""
      - name: upload-path
        type: string
        description: |-
          The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the JFrog Artifactory
          Ex. core_radar-aptiv-00000000-gen8_ind13400-local/reviews/45/12345/6/hw-tests/
        default: "core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/verification/1381/hw-tests/"
        ui:
          name: JFrog Upload Path
      - name: download-path
        type: string
        description: |-
          The path inside of JFrog to download the outputs from. Note - this does not include the base URL of the JFrog Artifactory
          Ex. core_radar-aptiv-00000000-gen8_ind13400-local/reviews/45/12345/6/buildFiles/
        default: "core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/verification/1381/buildFiles/"
        ui:
          name: JFrog Download Path
      - name: gateway
        type: string
        default: perceptionGateway
      - name: bench-name
        type: string
        default: ""
      - name: bench-user
        type: string
        description: The user of the reserved test bench
      - name: bench-ip
        type: string
        description: The ip of the reserved test bench
      - name: testDuration
        type: string
        description: The test duration in seconds
      - name: architecture
        type: string
        description: The architecture of the test bench (ex. x86, arm64)
        default: "windows"
    results:
      - name: jf-upload-url
        description: The URL the outputs are uploaded to.
      - name: jf-upload-path
        description: The path the outputs are uploaded to.
      - name: download-exit-code
        description: The exit code of the download step
      - name: setup-exit-code
        description: The exit code of the setup step
      - name: flash-exit-code
        description: The exit code of the flash step
      - name: smoke-test-exit-code
        description: The exit code of the smoke test step
      - name: upload-exit-code
        description: The exit code of the upload step
      - name: error-message
        description: A string with any new errors found
      - name: commit-hash
        description: commit-hash to provide to any downstream tasks
      - name: commit-hash-exit-code
        description: The exit code of the commit hash resolution step
    steps:
      - name: check-git-ref
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        params:
          repo-url: $(params.repo-url)
        script: |
          #!/bin/bash

          # set default return values
          echo -n "" > $(results.commit-hash.path)
          echo -n "1" > $(results.commit-hash-exit-code.path)
          echo -n "" > $(results.error-message.path)
          # Allow later steps/tasks running under different users to append safely.
          chmod 666 $(results.error-message.path) || true

          # Check input values
          if [ "$(params.bench-name)" == "" ]; then
            echo "No bench name, skipping stage"
            exit -1
          fi
          if [ "$(params.bench-user)" == "" ]; then
            echo "No bench user, skipping stage"
            exit -1
          fi
          if [ "$(params.bench-ip)" == "" ]; then
            echo "No bench IP, skipping stage"
            exit -1
          fi

          # Input parameters
          git_ref=$(params.commit-id)
          repo_url=$(params.repo-url)
          cp $(secrets.netrc.path) ~/.netrc

          # Function to resolve branch name or commit hash
          resolve_to_commit_hash() {
              local ref=$1
              local repo=$2
              if [ "$ref" == "dev" ]; then
                  # Get the latest commit hash for 'dev' branch using git ls-remote
                  latest_commit=$(git ls-remote "$repo" refs/heads/dev | awk '{print $1}')
                  if [ -z "$latest_commit" ]; then
                      echo "Error: Unable to retrieve the latest commit for 'dev' branch." >&2
                      echo -n "1" > $(results.commit-hash-exit-code.path)
                      exit 1
                  fi
                  echo "$latest_commit"
              else
                  # If it's not 'dev', assume it's a commit hash and validate it
                  if [[ "$ref" =~ ^[a-f0-9]{40}$ ]]; then
                      echo "$ref"
                  else
                      echo "Error: Invalid commit hash or unsupported ref format: $ref" >&2
                      echo -n "1" > $(results.commit-hash-exit-code.path)
                      exit 1
                  fi
              fi
          }

          # Main logic
          if [ -z "$git_ref" ] || [ -z "$repo_url" ]; then
              echo "Usage: $0 <git-ref> <repository-url>" >&2
              echo -n "1" > $(results.commit-hash-exit-code.path)
              exit 1
          fi

          # Resolve the commit hash
          commit_hash=$(resolve_to_commit_hash "$git_ref" "$repo_url")

          echo -n "$commit_hash" >> $(results.commit-hash.path)
          echo "Resolved Commit Hash: $commit_hash"
          echo -n "0" > $(results.commit-hash-exit-code.path)

      - name: setup-workspace
        task: Utils/core-radar-studio-cli@1.0.0
        onError: continue
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "1" > $(results.setup-exit-code.path)

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"

            architecture="$(params.architecture)"
            architecture_lc="${architecture,,}"

            if [[ "$architecture_lc" == *windows* ]]; then
              echo "Using Windows Bench"
              cmd_prefix="cd wrsd_ci_scripts/WRSD/ & cmd /c"
              setup_script="bench_clone.bat"
              repo_tag="hw-test/v1.0.29"
            else
              echo "Using Linux Bench"
              cmd_prefix="cd git/ADVRADAR_CICD/RPI && chmod +x bench_clone.sh && bash"
              setup_script="bench_clone.sh"
              repo_tag="ADVRADAR_CICD:hw-test/v1.0.28 Core_Radar_Gen8_iND13400:$(params.commit-id)"
            fi

            parameters='["$(params.bench-user)","$(params.bench-ip)","'"$cmd_prefix"'","'"$setup_script"'","'"$repo_tag"'"]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            echo "------------------------------ TAS OUTPUT"
            cat target_action_output.log
            echo "------------------------------"

            target_action_output=$(cat target_action_output.log)

            error_patterns=(
              "^fatal:"
              "reference is not a tree"
              "\[rejected\]"
              "would clobber existing tag"
              "Permission denied"
              "\[Errno"
            )

            for pattern in "${error_patterns[@]}"; do
              if echo "$target_action_output" | grep -Eiq "$pattern"; then

                error_message=$(echo "$target_action_output" | grep -Ei "$pattern" | head -n 1)
                echo "------------------------------"
                echo "ERROR DETECTED:"
                echo "$error_message"
                echo "------------------------------"
                echo "Error setting up workspace" >> $(results.error-message.path)
                echo "true" > $(results.unstable.path)
                exit 2
              fi
            done
            echo -n "0" > $(results.setup-exit-code.path)

      - name: clean-workspace
        task: Utils/core-radar-studio-cli@1.0.0
        onError: continue
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"

            # Normalize architecture so matching works for Windows-10/11 and mixed-case values.
            architecture="$(params.architecture)"
            architecture_lc="${architecture,,}"

            # Treat any architecture containing "windows" as Windows; otherwise default to Linux.
            if [[ "$architecture_lc" == *windows* ]]; then
              echo "Using Windows Bench"
              bench_cmd="cd wrsd/scripts/ & cmd /c"
              script_name="killPythonProcesses.bat"
            else
              echo "Using Linux Bench"
              bench_cmd="echo"
              script_name="[Linux Bench] No action required — skipping kill step"
            fi

            # run_cmd_on_target expects: [user, ip, command prefix, script name, script args]
            parameters='["$(params.bench-user)","$(params.bench-ip)","'"$bench_cmd"'","'"$script_name"'",""]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            echo "------------------------------ TAS OUTPUT"
            cat target_action_output.log
            echo "------------------------------"

            target_action_output=$(cat target_action_output.log)

            error_strings=("Error" "\[Errno")

            for error in "${error_strings[@]}"; do
              if echo "$target_action_output" | grep -q "$error"; then

                error_message=$(echo "$target_action_output" | grep -i "$error")
                echo "------------------------------"
                echo "ERROR: $error_message"
                echo "------------------------------"

                echo "Clean Stage: $error_message" >> $(results.error-message.path)
                exit 2
              fi
            done

      - name: download-build-files
        task: Utils/core-radar-studio-cli@1.0.0
        onError: continue
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "0" > $(results.download-exit-code.path)

            if [  $(cat $(results.setup-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Setup Stage Failed, skipping the download stage."
              echo "------------------------------"
              exit 0
            fi

            # Define the config file path
            config_file="./config.json"

            if [ -f "$config_file" ]; then
                echo "$config_file exists"
            else
                # Provision the gateway config file
                studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
            fi

            # Setup parameters for python script call on test bench
            action_script="target_scripts/run_cmd_on_target.sh"

            architecture="$(params.architecture)"
            architecture_lc="${architecture,,}"

            if [[ "$architecture_lc" == *windows* ]]; then
              echo "Using Windows Bench"
              cmd_prefix="cd wrsd/scripts/ & python"
              jfrog_target_path="C:/Users/SID_ADVRADAR_CICD/wrsd_jfrog/"
            else
              echo "Using Linux Bench"
              cmd_prefix="cd /home/sid_advradar_cicd/git/ADVRADAR_CICD/WRSD/jfrog/ && python3"
              jfrog_target_path="/home/sid_advradar_cicd/wrsd_jfrog/"
            fi

            parameters='["$(params.bench-user)","$(params.bench-ip)","'"$cmd_prefix"'","downloadfromJfrog.py","$(params.download-path)output_$(params.variant).zip '"$jfrog_target_path"'"]'

            echo "Target Action Script Parameters: $parameters"

            studio-cli vlab physical slc target act \
              --gwid=$(params.gateway) \
              --target-name=$(params.bench-name) \
              --action-path="$action_script" \
              --config-file="$config_file" \
              --parameters="$parameters" \
              | tee target_action_output.log

            target_action_output=$(cat target_action_output.log)

            error_found=false
            error_type=""
            error_message=""

            # Check for Python ValueError (invalid file/data issues)
            if echo "$target_action_output" | grep -q "ValueError:"; then
              error_found=true
              error_type="Python ValueError Detected"
              error_message=$(echo "$target_action_output" | grep -o "ValueError:[^E]*" | sed 's/Exit status code.*//' | sed 's/[[:space:]]*$//')
              echo "true" > $(results.unstable.path)
            # Check for invalid ZIP file specifically
            elif echo "$target_action_output" | grep -q "is not a valid ZIP file"; then
              error_found=true
              error_type="Invalid ZIP File Error"
              error_message=$(echo "$target_action_output" | grep -o "ValueError:.*is not a valid ZIP file\.")
              echo "true" > $(results.unstable.path)
            # Check for other known errors (fallback)
            else
              error_strings=("Error: Gateway disconnected" "Error: Gateway Not Registered" "Error: Failed to connect with the gateway" "server http error 50" "\[Errno")

              for error in "${error_strings[@]}"; do
                if echo "$target_action_output" | grep -q "$error"; then
                  error_found=true
                  error_type="ERROR"
                  error_message=$(echo "$target_action_output" | grep -i "$error")
                  break
                fi
              done
            fi

            # If any error was found, handle it once
            if [ "$error_found" = true ]; then
              echo "------------------------------"
              echo "$error_type:"
              echo "$error_message"
              echo "------------------------------"

              echo "Download Stage: $error_message" >> $(results.error-message.path)
              echo -n "1" > $(results.download-exit-code.path)
              exit 2
            fi

            echo -n "0" > $(results.download-exit-code.path)

      - name: flash-build
        task: Utils/core-radar-studio-cli@1.0.0
        onError: continue
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "0" > $(results.flash-exit-code.path)

            architecture="$(params.architecture)"
            architecture_lc="${architecture,,}"

            if [[ "$architecture_lc" == *windows* ]]; then
              echo "Using Windows Bench"
              cmd_prefix="cmd /c C:/Users/SID_ADVRADAR_CICD/wrsd_ci_scripts/WRSD/power/power_on.bat & cd wrsd_jfrog/quickflash/ & cmd /c"
              flash_script="RunQuickFlash.bat"
              flash_args=" -c sensor_config.json -v $(params.build-variant)"
            else
              echo "Using Linux Bench"
              cmd_prefix="python3 \$HOME/git/ADVRADAR_CICD/RPI/smoke_test/libs/power_on.py && cd \$HOME/wrsd_jfrog/quickflash/ && chmod +x RunQuickFlash.sh && bash"
              flash_script="RunQuickFlash.sh"
              flash_args=" -c ./sensor_config.json -v $(params.build-variant)"
            fi

            if [  $(cat $(results.setup-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Setup Stage Failed, skipping the flashing."
              echo "------------------------------"
              exit 0
            elif [ $(cat $(results.download-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Download Stage Failed, skipping the flashing stage."
              echo "------------------------------"
              exit 0
            else

              # Define the config file path
              config_file="./config.json"

              if [ -f "$config_file" ]; then
                  echo "$config_file exists"
              else
                  # Provision the gateway config file
                  studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
              fi

              echo "Running smoke test for $(params.testDuration) seconds"

              # Setup parameters for python script call on test bench
              action_script="target_scripts/run_cmd_on_target.sh"

              parameters='["$(params.bench-user)","$(params.bench-ip)","'"$cmd_prefix"'","'"$flash_script"'","'"$flash_args"'"]'

              echo "Target Action Script Parameters: $parameters"

              attempt=1
              max_attempts=2
              success=false

              while [ $attempt -le $max_attempts ]; do
                echo "Attempt $attempt of $max_attempts..."
                studio-cli vlab physical slc target act \
                  --gwid=$(params.gateway) \
                  --target-name=$(params.bench-name) \
                  --action-path="$action_script" \
                  --config-file="$config_file" \
                  --parameters="$parameters" \
                  | tee target_action_output.log || true

                target_action_output=$(cat target_action_output.log)

                if echo "$target_action_output" | grep -q 'Successfully flashed variant:'; then
                  echo "------------------------------"
                  echo "Flashing Complete"
                  echo "------------------------------"
                  success=true
                  break
                fi

                if echo "$target_action_output" | grep -q "Error: Gateway disconnected"; then
                  echo "Detected 'Gateway Disconnected' error. Retrying..."
                  ((attempt++))
                else
                  break
                fi
              done

              if [ "$success" = false ]; then
                error_found=false
                error_type=""
                error_message=""

                # Check for power supply connection errors first (critical hardware issue)
                if echo "$target_action_output" | grep -q "ERROR: Unable to connect to port.*for the power supply"; then
                  error_found=true
                  error_type="Power Supply Connection Error"
                  error_message=$(echo "$target_action_output" | grep -o "ERROR: Unable to connect to port[^.]*\.")
                  echo "true" > $(results.unstable.path)
                # Extract all ERROR:QuickFlash lines from the output
                elif echo "$target_action_output" | grep -q "ERROR:QuickFlash:"; then
                  error_found=true
                  error_type="QuickFlash Errors Detected"
                  # Extract only the ERROR:QuickFlash lines and add newlines before each
                  error_message=$(echo "$target_action_output" | sed 's/ERROR:QuickFlash:/\nERROR:QuickFlash:/g' | grep "ERROR:QuickFlash:" | sed 's/INFO.*$//' | sed 's/[[:space:]]*$//')

                  echo "true" > $(results.unstable.path)
                # Check for Python AttributeError (usually indicates a code/hardware issue)
                elif echo "$target_action_output" | grep -q "AttributeError:"; then
                  error_found=true
                  error_type="Python AttributeError Detected"
                  error_message=$(echo "$target_action_output" | grep -o "AttributeError:[^I]*" | head -1)

                # No specific errors found, check for other known errors (fallback)
                else
                  error_strings=("Error: Gateway disconnected" "Error: Gateway Not Registered" "Failed to flash variant" "\[Errno" "Error:")

                  for error in "${error_strings[@]}"; do
                    if echo "$target_action_output" | grep -q "$error"; then
                      error_found=true
                      error_type="ERROR"
                      # Extract just the relevant error portion
                      error_message=$(echo "$target_action_output" | grep -o "$error[^I]*" | head -1 | sed 's/INFO.*$//' | sed 's/[[:space:]]*$//')
                      break
                    fi
                  done
                fi

                # If any error was found, handle it once
                if [ "$error_found" = true ]; then
                  echo "------------------------------"
                  echo "$error_type:"
                  echo "$error_message"
                  echo "------------------------------"

                  echo "Flashing Stage: $error_message" >> $(results.error-message.path)
                  echo -n "1" > $(results.flash-exit-code.path)

                  echo "true" > "$(results.unstable.path)"
                  # Set sane defaults for future steps:
                  echo -n "" > $(results.smoke-test-exit-code.path)
                  echo -n "" > $(results.upload-exit-code.path)
                  echo -n "" > $(results.jf-upload-url.path)
                  echo -n "" > $(results.jf-upload-path.path)

                  exit 3
                fi
              fi

              if echo "$target_action_output" | grep -q 'Successfully flashed variant:'; then
                echo "------------------------------"
                echo "Flashing Complete"
                echo "------------------------------"
              fi
            fi

            echo -n "0" > $(results.flash-exit-code.path)

      - name: smoke-test
        task: Utils/core-radar-studio-cli@1.0.0
        onError: continue
        WhenVal: false
        params:
          script: |-
            #!/bin/bash
            set +e # Disable immediate exit on error
            set +x # Disable command tracing globally

            echo -n "0" > $(results.smoke-test-exit-code.path)

            if [  $(cat $(results.setup-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Setup Stage Failed, skipping the download, flashing, smoke test, and upload stages."
              echo "------------------------------"
              exit 0
            elif [ $(cat $(results.download-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Download Stage Failed, skipping the flashing and smoke test stage."
              echo "------------------------------"
              exit 0
            elif [ $(cat $(results.flash-exit-code.path)) == 1 ]; then
              echo "------------------------------"
              echo "Flash Stage Failed, skipping the smoke test stage."
              echo "------------------------------"
              exit 0
            else

              # Define the config file path
              config_file="./config.json"

              if [ -f "$config_file" ]; then
                  echo "$config_file exists"
              else
                  # Provision the gateway config file
                  studio-cli vlab physical slc gateway provision --gwid "$(params.gateway)" -f "$config_file"
              fi

              echo "Running smoke test for $(params.testDuration) seconds"

              # Setup parameters for python script call on test bench
              action_script="target_scripts/run_cmd_on_target.sh"

              architecture="$(params.architecture)"
              architecture_lc="${architecture,,}"

              if [[ "$architecture_lc" == *windows* ]]; then
                echo "Using Windows Bench"
                parameters='["$(params.bench-user)","$(params.bench-ip)","cd wrsd_ci_scripts/WRSD/smoke_test_scripts/python/ & python","Gen8_IntegrationTest.py","-o Gen8_$(params.variant)_Integration_Test -v $(params.variant) -t $(params.testDuration) -c $(params.comment)_$(params.commit-id) -b $(params.commit-id) -m true -k COM4 -e \"Ethernet 3\" -w wrsd_jfrog/$(params.build-variant)/streamdefs/wiresharkDissector.lua -a wrsd_jfrog/$(params.build-variant)/r52App.elf --expectedStreams \"1, 2, 3, 4, 5, 7, 8, 9, 15, 20, 45\""]'
              else
                echo "Using Linux Bench"
                parameters='["$(params.bench-user)","$(params.bench-ip)","cd git/ADVRADAR_CICD/RPI/smoke_test/ && chmod +x run_smoke_test.sh && bash","run_smoke_test.sh"," -- --spec git/Core_Radar_Gen8_iND13400/tools/CI/WRSD/smoke_test_spec_gen8.yaml -o Gen8_$(params.variant)_Integration_Test -v $(params.variant) -t $(params.testDuration) -c $(params.comment)_$(params.commit-id) -e \"eth0\" -L wrsd_jfrog/$(params.build-variant)/streamdefs/wiresharkDissector.lua -E wrsd_jfrog/$(params.build-variant)/r52App.elf"]'
              fi

              echo "Target Action Script Parameters: $parameters"

              studio-cli vlab physical slc target act \
                --gwid=$(params.gateway) \
                --target-name=$(params.bench-name) \
                --action-path="$action_script" \
                --config-file="$config_file" \
                --parameters="$parameters" \
                | tee target_action_output.log

              target_action_output=$(cat target_action_output.log)

              # If the test framework explicitly reports PASS, treat this stage as successful
              # even if ancillary/background components printed tracebacks.
              if echo "$target_action_output" | grep -Eq \
                'Overall Test Status:[[:space:]]*PASS|^Result:[[:space:]]*PASS'; then
                echo "Smoke test reported PASS."
                echo -n "0" > $(results.smoke-test-exit-code.path)
                exit 0
              fi

              if echo "$target_action_output" | grep -Eq \
                'Overall Test Status:[[:space:]]*FAIL|^Result:[[:space:]]*FAIL'; then

                  # Try to extract Passing/Failing summary if present
                  summary=$(echo "$target_action_output" | grep '^Passing:' || true)

                  {
                      echo "Completed smoke test but failed testcase(s). See report in JFrog."
                      [ -n "$summary" ] && echo "$summary"
                    } >> $(results.error-message.path)

                    echo -n "2" > $(results.smoke-test-exit-code.path)

                  # Mark this task unstable
                  echo "true" > "$(results.unstable.path)"

                  exit 3
              fi

              error_strings=("\[Errno" "ERROR: No BRR" "ERROR:" "Overall Test Status: FAIL" "Exit status code 1" "Exit status code 2" "Exit status code 3" "Exit status code 4" "Exit status code 5" "Exit status code 6" "Exit status code 7" "Exit status code 8" "Exit status code 9")
              for error in "${error_strings[@]}"; do
                if echo "$target_action_output" | grep -q "$error"; then
                  error_message=$(echo "$target_action_output" | grep -i "$error")
                  echo "------------------------------"
                  echo "ERROR: $error_message"
                  echo "------------------------------"

                  echo "Testing Stage: $error_message" >> $(results.error-message.path)
                  echo -n "1" > $(results.smoke-test-exit-code.path)

                  # Mark this task unstable
                  echo "true" > $(results.unstable.path)
                  exit 4
                fi
              done
            fi
            echo -n "0" > $(results.smoke-test-exit-code.path)

      - name: upload-report
