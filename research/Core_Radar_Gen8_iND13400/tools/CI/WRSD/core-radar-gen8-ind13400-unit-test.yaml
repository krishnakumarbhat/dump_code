        description: The Gerrit patchset number
        default: ""
        ui:
          name: patchset-number
      - name: branch-coverage
        type: string
        description: Branch coverage results from UT
        default:
        ui:
          name: branch-coverage
      - name: function-coverage
        type: string
        description: Function coverage results from UT
        ui:
          name: function-coverage
      - name: line-coverage
        type: string
        description: Line coverage results from UT
        ui:
