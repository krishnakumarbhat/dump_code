langVersion: v1
name: core-radar-gen8-ind13400-trigger-post-merge
description: Pipeline that is triggered by Gerrit and then launches all downstream pipelines for the project
ui:
  name: core-radar-gen8-ind13400-trigger-post-merge
params:
  - name: upload-path
    type: string
    default: core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/post-merge/$(config.pipeline.runNumber)
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: ""
  - name: branch
    type: string
    default: ""
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen8_iND13400
  - name: github-url
    type: string
    default: https://aptv.ghe.com
  - name: github-owner
    type: string
    default: GPO
  - name: github-repo
    type: string
    default: Core_Radar_Gen8_iND13400
compute:
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
tasks:
  - parallelTasks:
    - name: auto-rebase
      task: Utils/ADVRADAR/auto-rebase@1.0.0
      compute: linux-2c8g
      params:
        gerrit-url: $(params.gerrit-url)
        project-name: $(params.project-url-encoded)
        branch: $(params.branch)
    - name: update
      task: local/update-pipelines
      compute: linux-1c4g
      when:
      - input: $(params.branch)
        operator: in
        values:
        - dev
      params:
        git-ref: $(params.commit-id)
        gerrit-url: $(params.gerrit-url)
        project-name: $(params.project-url-encoded)
    - name: github-dev-sync
      task: local/sync-gerrit-dev-to-github
      compute: linux-1c4g
      when:
      - input: $(params.branch)
        operator: in
        values:
        - dev
      params:
        gerrit-url: $(params.gerrit-url)
        project-name: $(params.project-url-encoded)
        github-url: $(params.github-url)
        github-owner: $(params.github-owner)
        github-repo: $(params.github-repo)
final:
- name: grafana-publish-metrics-platform-flr8
  meta: {}
  params:
    image: $(studio.systemRegistry)/devsecops/dashboard:1.0
    netrccreds: $(secrets.netrc)
    patchset-revision: $(params.branch)
    pipeline-type: post-merge
    project-name: core-radar-gen8-ind13400-trigger-nightly
    scm:
      branch-name: feature/sw-quality
      repo-name: 00000000_wrsd/metrics
    shebang: '#!/usr/bin/env python3'
  task: Utils/grafana-publish-metrics@1.0.0
defineTasks:
  - langVersion: v1
    name: update-pipelines
    category: local
    params:
      - name: git-ref
        type: string
        description: The git commit hash or branch to check out from Gerrit
        default: dev
        ui:
          name: Commit Hash or Branch
      - name: gerrit-url
        type: string
        default: https://gitgerrit.asux.aptiv.com
      - name: project-name
        type: string
        default: Core_Radar_Gen8_iND13400
    steps:
      - name: shallow-clone
        task: Utils/YGGDRASIL/git-shallow-clone@0.0.1
        params:
          depth: "1"
          repository:
            git-ref: $(params.git-ref)
            password: $(secrets.gerrit-cred.password.path)
            url: $(params.gerrit-url)/$(params.project-name)
            username: $(secrets.gerrit-cred.username.path)
        WhenVal: false
      - name: studio-update-pipelines
        task: Utils/studio-cli@1.0.0
        params:
          overrides:
            plm_URIBASE: $(studio.plmURIBase)
          script: |
            cd $(params.project-name)/tools/CI/WRSD
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-build" -f "core-radar-gen8-ind13400-build.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-coverity" -f "core-radar-gen8-ind13400-coverity.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-hw-test" -f "core-radar-gen8-ind13400-hw-test.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-precommit-check" -f "core-radar-gen8-ind13400-precommit-check.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-trigger-nightly" -f "core-radar-gen8-ind13400-trigger-nightly.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-trigger-post-merge" -f "core-radar-gen8-ind13400-trigger-post-merge.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-trigger-verification" -f "core-radar-gen8-ind13400-trigger-verification.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-unit-test" -f "core-radar-gen8-ind13400-unit-test.yaml"
            studio-cli plm pipeline update --name "core-radar-gen8-ind13400-trigger-weekly" -f "core-radar-gen8-ind13400-trigger-weekly.yaml"
            studio-cli plm trigger update -f "ind13400-trigger-verification.yaml"
            studio-cli plm trigger update -f "ind13400-trigger-post-merge.yaml"
        WhenVal: false

  - langVersion: v1
    name: sync-gerrit-dev-to-github
    category: local
    params:
      - name: gerrit-url
        type: string
        default: https://gitgerrit.asux.aptiv.com
      - name: project-name
        type: string
        default: Core_Radar_Gen8_iND13400
      - name: github-url
        type: string
        default: https://aptv.ghe.com
      - name: github-owner
        type: string
        default: GPO
      - name: github-repo
        type: string
        default: Core_Radar_Gen8_iND13400
    steps:
      - name: sync-dev
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          GERRIT_USER="$(cat $(secrets.gerrit-cred.username.path))"
          GERRIT_PASS="$(cat $(secrets.gerrit-cred.password.path))"
          GITHUB_USER="$(cat $(secrets.github-cred.username.path))"
          GITHUB_TOKEN="$(cat $(secrets.github-cred.password.path))"

          GERRIT_URL="$(params.gerrit-url)"
          PROJECT_NAME="$(params.project-name)"
          GITHUB_URL="$(params.github-url)"
          GITHUB_OWNER="$(params.github-owner)"
          GITHUB_REPO="$(params.github-repo)"

          GITHUB_HOST="${GITHUB_URL#https://}"
          GERRIT_HOST="${GERRIT_URL#https://}"

          # Use explicit auth header for GitHub (credential helper fails in non-interactive CI)
          GITHUB_BASIC=$(printf "%s:%s" "${GITHUB_USER}" "${GITHUB_TOKEN}" | base64 -w 0)
          GITHUB_HEADER="AUTHORIZATION: basic ${GITHUB_BASIC}"

          # Embed Gerrit credentials directly in fetch URL for non-interactive CI
          GERRIT_USER_ENC=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${GERRIT_USER}")
          GERRIT_PASS_ENC=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${GERRIT_PASS}")
          GERRIT_FETCH_URL="https://${GERRIT_USER_ENC}:${GERRIT_PASS_ENC}@${GERRIT_HOST}/a/${PROJECT_NAME}"

          REPO_DIR="${WORKSPACE}/github-dev-sync"
          rm -rf "${REPO_DIR}"

          git -c "http.https://${GITHUB_HOST}/.extraheader=${GITHUB_HEADER}" clone \
            "https://${GITHUB_HOST}/${GITHUB_OWNER}/${GITHUB_REPO}.git" "${REPO_DIR}"
          cd "${REPO_DIR}"

          # Persist auth header so all subsequent git-origin operations use it
          git config "http.https://${GITHUB_HOST}/.extraheader" "${GITHUB_HEADER}"
          git config user.name "SID-ADVRADAR-CICD"
          git config user.email "sid_advradar_cicd@aptiv.com"

          git fetch --no-tags "${GERRIT_FETCH_URL}" dev
          git checkout -B migration FETCH_HEAD

          # Download git-lfs binary at runtime (not installed in container image)
          LFS_VERSION="3.6.1"
          LFS_URL="https://github.com/git-lfs/git-lfs/releases/download/v${LFS_VERSION}/git-lfs-linux-amd64-v${LFS_VERSION}.tar.gz"
          LFS_DIR="${WORKSPACE}/git-lfs-bin"
          mkdir -p "${LFS_DIR}"
          curl -fsSL --output "${WORKSPACE}/git-lfs.tar.gz" "${LFS_URL}"
          tar -xf "${WORKSPACE}/git-lfs.tar.gz" -C "${LFS_DIR}"
          LFS_BIN=$(find "${LFS_DIR}" -name "git-lfs" -type f | head -1)
          chmod +x "${LFS_BIN}"
          export PATH="$(dirname "${LFS_BIN}"):${PATH}"
          # Set up JFrog LFS authentication via netrc (LFS backend is JFrog Artifactory)
          cp "$(secrets.netrc.path)" ~/.netrc
          chmod 600 ~/.netrc
          git lfs install --local
          git config lfs.https://jfrog.asux.aptiv.com/artifactory/api/lfs/core_radar-aptiv-00000000-gen8_ind13400-gitlfs-local.locksverify false
          git lfs migrate import --above="100 MB" --include-ref=migration

          git fetch origin dev || true
          if git show-ref --verify --quiet refs/remotes/origin/dev; then
            git checkout -B dev origin/dev
          else
            git checkout -B dev
          fi

          git reset --hard migration
          git push --force origin HEAD:dev

          echo "Synced Gerrit dev to GitHub dev successfully"
    wrrn: ""
storage:
  - name: shared
    defaultMount: true
    mountPath: /volumes/shared
    readOnly: false
    resource: Perception_Radar_FLR8_storage
timeout: 1h
