      - name: publish
        containerSettings: container-2c8g50g
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/usr/bin/env python3
          import subprocess
          import sys
          import os
          import re
          import tempfile

          TARGET = "/tmp/python-packages"
          MARKER = os.path.join(TARGET, ".deps_installed")
          REPORT_DIR = os.path.join(tempfile.gettempdir(), "latest_reports")

          if TARGET not in sys.path:
            sys.path.insert(0, TARGET)

          def install_deps_and_restart():
            subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--break-system-packages",
              "--no-cache-dir",
              "--target", TARGET,
              "psycopg2-binary",
              "pandas",
            ])

            os.makedirs(TARGET, exist_ok=True)
            with open(MARKER, "w", encoding="utf-8"):
              pass

            os.execv(sys.executable, [sys.executable] + sys.argv)

          if not os.path.exists(MARKER):
            print("Installing Python dependencies...")
            install_deps_and_restart()

          import psycopg2
          import pandas as pd
          from psycopg2 import sql, extras
          from datetime import datetime
          from psycopg2.extras import Json

          def insert_wrsd_tags(cursor, wrsd_tags):
              """
              Inserts or retrieves an existing wrsd_tags ID from perception_metrics_wrsd.
              """
              # Check if the wrsd_tags entry already exists
              cursor.execute("""
                  SELECT id FROM wrsd."perception_metrics_wrsd"
                  WHERE build_no = %s AND pipeline_name = %s;
              """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name']))
              result = cursor.fetchone()
              # If exists, return id, else insert new and return new id
              if result:
                  # print("WRSD entry already exists")
                  return result[0]
              else:
                  print("Creating a new WRSD entry")
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics_wrsd" (build_no, pipeline_name, status, duration, build_url)
                      VALUES (%s, %s, %s, %s, %s) RETURNING id;
                  """, (wrsd_tags['build_no'], wrsd_tags['pipeline_name'], wrsd_tags['status'], wrsd_tags['duration'], wrsd_tags['build_url']))
                  result = cursor.fetchone()[0]
                  return result

          def insert_perception_metrics(cursor, data_list):
              """
              Inserts multiple perception_metrics entries into the database.
              Parameters:
                  data_list (list of dict): List of dictionaries, each containing data for a single entry.
              """
              for data in data_list:
                  # First, insert or get the wrsd_tags ID
                  wrsd_id = insert_wrsd_tags(cursor, data['wrsd_tags'])
                  # Insert into PerceptionMetrics with reference to wrsd_id
                  cursor.execute("""
                      INSERT INTO wrsd."perception_metrics" ("CommitId", date, branch, tag, project, metric_name, metric_value, metric_tags, wrsd_id)
                      VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s);
                  """, (
                      data['commitid'],
                      data['date'],
                      data['branch'],
                      data['tag'],
                      data['project'],
                      data['metric_name'],
                      data['metric_value'],
                      Json(data['metric_tags']),
                      wrsd_id
                  ))

          def read_file(file_path):
            with open(os.path.expandvars(file_path), 'r') as file:
                return file.read().strip()

          def download_report(username, password, stream, view_type, view, suffix=None):
              """
              Downloads a Coverity report.
              """
              print(f"** Stream: {stream} **")
              baseurl = 'https://coverity.asux.aptiv.com/api/viewContents/'
              url = '%s%s/v1/%s' % (baseurl, view_type, re.sub(' ', '%20', view))

              os.makedirs(REPORT_DIR, exist_ok=True)
              if suffix is None:
                  filename = os.path.join(REPORT_DIR, f'{stream}.csv')
                  report = f'{stream}.csv'
              else:
                  filename = os.path.join(REPORT_DIR, f'{stream}_{suffix}.csv')
                  report = f'{stream}_{suffix}.csv'

              command = f'curl -s --header "Accept: text/csv" --user {username}:{password} "{url}?' \
                      f'projectId={stream}&rowCount=-1" -o "{filename}" '
              c = os.popen(command)
              c.close()
              print("Downloaded Report: ", filename)
              print("--------------------------------------")
              return filename

          def summarize_defects(allDefectsReport, compListReport, stream, variant, wrsd_tags, commit_hash, currentDateTime, project_name):
              """
              Processes the all defects report and generates a dictionary to send to platform health.
              """
              # Adding "Various" since the component report will not have it and
              # the issues report will give the category of "Various" for some issues
              component_list = {"Various": 0}
              misra_categories = {
                  "Mandatory": {"New": {}},
                  "Required": {"New": {}},
                  "Advisory": {"New": {}},
                  "None": {"New": {}},
              }
              grouped_issues = {
                  "High": {"None": {"New": {}}},
                  "Medium": {"None": {"New": {}}},
                  "Low": misra_categories,
              }
              data_list = []
              # Read the list of all components and add to the dictionary.
              # Assign 0 to all of them initially and increment later
              if os.path.isfile(compListReport):
                  data = pd.read_csv(compListReport)
                  df = pd.DataFrame(data, columns=["Component"])
                  data = df.groupby(["Component"]).size()
                  for comp, _count in data.items():
                      component_list[comp] = 0

              # Set a zero for each component in every impact/misra category/status
              # this helps display default values of 0, otherwise there is no data to be displayed
              for impact in grouped_issues:
                  for misraCategory in grouped_issues[impact]:
                      for status in grouped_issues[impact][misraCategory]:
                          grouped_issues[impact][misraCategory][status] = dict(component_list)
              cov_data = pd.read_csv(allDefectsReport)

              # List of expected headers
              headers = ["Impact", "Standard: MISRA Category", "Status", "Component", "Count"]
              for header in headers:
                  if header not in cov_data:
                      raise LookupError("Coverity All Issues Report file does not have all expected columns.")

              # Create a small data frame with only the needed columns
              cov_data = pd.DataFrame(cov_data, columns=headers)

              # need this so it reads the high and medium issue.
              cov_data["Standard: MISRA Category"] = cov_data["Standard: MISRA Category"].fillna("None")

              # Print summary
              total_high_issues = cov_data[cov_data["Impact"] == "High"]["Count"].sum()
              total_medium_issues = cov_data[cov_data["Impact"] == "Medium"]["Count"].sum()
              total_mandatory_issues = cov_data[cov_data["Standard: MISRA Category"] == "Mandatory"]["Count"].sum()
              total_required_issues = cov_data[cov_data["Standard: MISRA Category"] == "Required"]["Count"].sum()
              total_advisory_issues = cov_data[cov_data["Standard: MISRA Category"] == "Advisory"]["Count"].sum()

              print("-----------------------------------")
              print(f"Total High Issues     : {total_high_issues}")
              print(f"Total Medium Issues   : {total_medium_issues}")
              print(f"Total Mandatory Issues: {total_mandatory_issues}")
              print(f"Total Required Issues : {total_required_issues}")
              print(f"Total Advisory Issues : {total_advisory_issues}")
              print("-----------------------------------")

              # group by the provided headers.
              cov_data = cov_data.groupby(headers).size()

              # Iterate through the panda dataframe and add up the issue count for each component
              for row, count in cov_data.items():
                  result = dict(zip(headers, row))

                  impact = result["Impact"]
                  misraCategory = result["Standard: MISRA Category"]
                  status = result["Status"]
                  component = result["Component"]
                  # Convert issue count to integer safely
                  try:
                      issueCnt = int(result["Count"]) * count
                  except ValueError:
                      issueCnt = 0

                  # Safely initialize component if not already present
                  if status not in grouped_issues[impact][misraCategory]:
                      grouped_issues[impact][misraCategory][status] = dict(component_list)
                  if component not in grouped_issues[impact][misraCategory][status]:
                      grouped_issues[impact][misraCategory][status][component] = 0
                  grouped_issues[impact][misraCategory][status][component] += issueCnt

              # Iterate through the grouped_issues and prep them for platform health
              for impact, misraCategoryDict in grouped_issues.items():
                  for misraCategory, coverityIssueStatusDict in misraCategoryDict.items():
                      for status, componentDict in coverityIssueStatusDict.items():
                          if not componentDict:
                              # Add blank component for datadog so it can report 0 for this status
                              componentDict = {"None": 0}
                          for component, issueCnt in componentDict.items():

                              metric_tags = {
                                  "variant": variant,
                                  "impact": impact,
                                  "misra_category": misraCategory,
                                  "status": status,
                                  "component": component,
                                  "stream": stream
                              }

                              data_list.append({
                                  "commitid": commit_hash,
                                  "date": currentDateTime,
                                  "branch": "dev",
                                  "tag": "",
                                  "project": project_name,
                                  "metric_name": "core_radar.gen8.coverity.defects",
                                  "metric_value": issueCnt,
                                  "metric_tags": metric_tags,
                                  "wrsd_tags": wrsd_tags
                              })

              return data_list

          def summarize_ccm(ccmReport, stream, variant, wrsd_tags, commit_hash, currentDateTime, project_name):
              """
              Processes the CCM report and generates a dictionary to send to platform health.
              """
              grouped_ccm = {
                "CCM_1_to_15": {},
                "CCM_16_to_50": {},
                "CCM_51_plus": {},
              }
              data_list = []

              ccm_data = pd.read_csv(ccmReport)
              # list of expected headers
              headers = ["Component", "CCM"]

              for header in headers:
                  if header not in ccm_data:
                      raise LookupError("Coverity CCM Report file does not have all expected columns.")

              # Create a small data frame with only the needed columns for CCM data
              ccm_data = pd.DataFrame(ccm_data, columns=headers)

              # group by the provided headers.
              ccm_data = ccm_data.groupby(headers).size()

              # Iterate through the panda dataframe and add up the CCM issues in reach category
              for row, count in ccm_data.items():
                  result = dict(zip(headers, row))

                  component = result["Component"]
                  ccm = result["CCM"]

                  if ccm <= 15:
                      try:
                          grouped_ccm["CCM_1_to_15"][component] += count
                      except KeyError:
                          grouped_ccm["CCM_1_to_15"][component] = count
                  elif (ccm > 15) and (ccm <= 50):
                      try:
                          grouped_ccm["CCM_16_to_50"][component] += count
                      except KeyError:
                          grouped_ccm["CCM_16_to_50"][component] = count
                  elif ccm > 50:
                      try:
                          grouped_ccm["CCM_51_plus"][component] += count
                      except KeyError:
                          grouped_ccm["CCM_51_plus"][component] = count
                  else:
                      continue

              # Iterate through the grouped_ccm and send to datadog
              for ccm_group, componentDict in grouped_ccm.items():
                  if not componentDict:
                      # Add blank component for datadog so it can report zero for this ccm_group
                      componentDict = {"None": 0}
                  for component, issueCnt in componentDict.items():

                      metric_tags = {
                          "variant" : variant,
                          "ccm_group" : ccm_group,
                          "component" : component,
                          "stream" : stream
                        }

                      data_list.append({
                        "commitid": commit_hash,
                        "date": currentDateTime,
                        "branch": "dev",
                        "tag": "",
                        "project": project_name,
                        "metric_name": "core_radar.gen8.coverity.ccm",
                        "metric_value": issueCnt,
                        "metric_tags": metric_tags,
                        "wrsd_tags": wrsd_tags
                        })
              return data_list

          #------------------------------------------------------------------------------------------

          # Database connection details
          pg_user = read_file(r'$(secrets.postgresql-auth.username.path)')
          pg_pass = read_file(r'$(secrets.postgresql-auth.password.path)')
          cov_user = read_file(r'$(secrets.netrc.coverityUser_Report.path)')
          cov_pass = read_file(r'$(secrets.netrc.coverityPass_Report.path)')

          db_config = {
              "dbname": "monitoring",
              "user": pg_user,
              "password": pg_pass,
              "host": "monitoring-wrds.c9qq8e0oklwk.eu-central-1.rds.amazonaws.com",
              "port": "5432"
          }

          variant = "$(params.variant)"
          branch = "$(params.branch)"
          project_name = "$(params.project-name)"
          build_no = $(config.pipeline.runNumber)
          build_name = "$(config.pipeline.name)"
          commit_hash = "$(params.git-ref)"
          change_number = "$(params.change-number)"
          patchset_number = "$(params.patchset-number)"
          build_url = f"https://$(studio.home)/plm/view/{build_name}/runs/{build_no}"
          stream_list = [item.strip() for item in '$(params.streams)'.split(",")]
          now = datetime.now()
          currentDateTime = now.strftime("%Y-%m-%d %H:%M:%S")

          wrsd_tags = {
            "build_no": build_no,
            "pipeline_name": build_name,
            "status": None,
            "duration": None,
            "build_url": build_url
            }
          if branch == "dev":
            try:
                connection = psycopg2.connect(**db_config)
                cursor = connection.cursor()
            except Exception as e:
                print("An error occurred:", e)

            print("----------------------------------------------------------")
            print("- Download coverity defects, components, and ccm reports -")
            print("----------------------------------------------------------")
            for stream in stream_list:

              defects_reports = download_report(cov_user, cov_pass, stream, 'issues', 'All_Defects', 'Defects')
              components_report = download_report(cov_user, cov_pass, stream, 'components', 'All_Components',   "Components")
              ccm_report = download_report(cov_user, cov_pass, stream, 'functions', 'All_CCM', 'CCM')

              defect_data = summarize_defects(defects_reports, components_report, stream, variant, wrsd_tags, commit_hash, currentDateTime, project_name)
              ccm_data = summarize_ccm(ccm_report, stream, variant, wrsd_tags, commit_hash, currentDateTime, project_name)

              try:
                  # Insert multiple data entries
                  insert_perception_metrics(cursor, defect_data)
                  connection.commit()
                  print(f"Coverity Defects data inserted successfully for stream {stream}.")

                  insert_perception_metrics(cursor, ccm_data)
                  connection.commit()
                  print(f"Coverity CCM data inserted successfully for stream {stream}.")
              except Exception as e:
                  connection.rollback()
                  print("An error occurred:", e)

            if connection:
                cursor.close()
                connection.close()
          else:
            print("Not Dev branch so nothing will be commited to Platform Health.")
        onError: continue
