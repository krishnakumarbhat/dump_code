langVersion: v1
name: core-radar-gen8-ind13400-coverity
description: Pipeline that builds coverity for all variants of the code for Gen8 iND13400
ui:
  name: core-radar-gen8-ind13400-coverity
params:
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: dev
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen8_iND13400
  - name: upload-path
    type: string
    description: |-
      The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the repository
      Ex. core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/manual/coverity/$(config.pipeline.runNumber)
    default: core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/manual/coverity/$(config.pipeline.runNumber)
    ui:
      name: JFrog Upload Path
  - name: branch
    type: string
    default: dev
  - name: patchset-number
    type: string
    default: ""
compute:
  - name: linux-16c64g
    resource: asp-compute-linux-16c64g
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
  - resource: asp-compute-linux-1c4g # This becomes the default compute.
containerSettings:
  - name: container-16c64g300g
    resource: asp-container-16c64g300g
  - name: container-8c32g150g
    resource: asp-container-8c32g150g
  - name: container-2c8g50g
    resource: asp-container-2c8g50g
  - name: container-1c4g25g
    resource: asp-container-1c4g25g
tasks:
  - name: publish-run
    task: Utils/core-radar-publish-run@0.1.1
  - parallelTasks:
      - name: build-flr8-r52
        task: build/build
        params:
          core: r52
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: flr8
          cov-stream: "10034606_Core_Radar_Gen8_IND13400_FLR8_R52"
        steps:
        - name: build-code
          steps:
          - name: build
            containerSettings: container-16c64g300g
      - name: build-flr8-bbe32
        task: build/build
        params:
          core: bbe32
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: flr8
          cov-stream: "10034606_Core_Radar_Gen8_IND13400_FLR8_BBE32"
        steps:
        - name: build-code
          steps:
          - name: build
            containerSettings: container-16c64g300g
  - parallelTasks:
      - name: build-srr8p-r52
        task: build/build
        params:
          core: r52
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: srr8p
          cov-stream: "10034606_Core_Radar_Gen8_IND13400_SRR8p_R52"
        steps:
        - name: build-code
          steps:
          - name: build
            containerSettings: container-16c64g300g
      - name: build-srr8p-bbe32
        task: build/build
        params:
          core: bbe32
          git-ref: $(params.commit-id)
          upload-path: $(params.upload-path)
          variant: srr8p
          cov-stream: "10034606_Core_Radar_Gen8_IND13400_SRR8p_BBE32"
        steps:
        - name: build-code
          steps:
          - name: build
            containerSettings: container-16c64g300g
  - name: prepare-vote-and-message
    task: Utils/prepare-vote-and-message
    params:
      build-exit-codes:
        FLR8_R52: $(tasks.build-flr8-r52.results.build-exit-code)
        FLR8_BBE32: $(tasks.build-flr8-bbe32.results.build-exit-code)
        SRR8P_R52: $(tasks.build-srr8p-r52.results.build-exit-code)
        SRR8P_BBE32: $(tasks.build-srr8p-bbe32.results.build-exit-code)
      upload-exit-codes:
        FLR8_R52: $(tasks.build-flr8-r52.results.upload-exit-code)
        FLR8_BBE32: $(tasks.build-flr8-bbe32.results.upload-exit-code)
        SRR8P_R52: $(tasks.build-srr8p-r52.results.upload-exit-code)
        SRR8P_BBE32: $(tasks.build-srr8p-bbe32.results.upload-exit-code)
      error-messages:
        FLR8_R52: $(tasks.build-flr8-r52.results.error-message)
        FLR8_BBE32: $(tasks.build-flr8-bbe32.results.error-message)
        SRR8P_R52: $(tasks.build-srr8p-r52.results.error-message)
        SRR8P_BBE32: $(tasks.build-srr8p-bbe32.results.error-message)
  - name: build-vote
    task: Utils/post-gerrit-comment-vote-flr8@1.1.1
    params:
      gerrit-setup: {}
      message: |-
        $(tasks.prepare-vote-and-message.results.vote-message)

        Build Outputs: [Coverity Reports](https://jfrog.asux.aptiv.com/ui/repos/tree/General/$(params.upload-path))
        Build Job: [$(config.pipeline.name)_$(config.pipeline.runNumber)](https://$(studio.home)/plm/view/$(config.pipeline.name)/runs/$(config.pipeline.runNumber))
      votes:
        Coverity: $(tasks.prepare-vote-and-message.results.vote-value)
  - parallelTasks:
      # Send memory stats to Platform Health
      - name: publish-metrics-flr8
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        task: Utils/publish-metrics
        params:
          git-ref: $(params.commit-id)
          change-number : $(params.change-id)
          branch: $(params.branch)
          patchset-number: $(params.patchset-number)
          project-name: $(params.project-url-encoded)
          variant: flr8
          streams:  "10034606_Core_Radar_Gen8_IND13400_FLR8_R52, 10034606_Core_Radar_Gen8_IND13400_FLR8_BBE32"
          commit-hash: $(tasks.build-flr8-r52.results.commit-hash)
      - name: publish-metrics-srr8p
        when:
          - input: $(params.commit-id)
            operator: in
            values:
              - dev
        task: Utils/publish-metrics
        params:
          git-ref: $(params.commit-id)
          change-number : $(params.change-id)
          branch: $(params.branch)
          patchset-number: $(params.patchset-number)
          project-name: $(params.project-url-encoded)
          variant: srr8p
          streams:  "10034606_Core_Radar_Gen8_IND13400_SRR8p_R52, 10034606_Core_Radar_Gen8_IND13400_SRR8p_BBE32"
          commit-hash: $(tasks.build-srr8p-r52.results.commit-hash)
      - name: auto-submit-check
        task: Utils/ADVRADAR/auto-submit@1.0.1
        params:
          project-name: $(params.project-url-encoded)
          change-id: $(params.change-id)
          gerrit-url: $(params.gerrit-url)
          comment: "False"
defineTasks:
  - name: build
    langVersion: v1
    category: build
    params:
      - name: git-ref
        type: string
        description: The git commit hash or branch to check out from Gerrit
        default: dev
        ui:
          name: Commit Hash or Branch
      - name: variant
        type: select
        description: Variant to Build
        ui:
          name: variant
        options:
          - name: flr8
            description: Variant is flr8
            value: flr8
          - name: srr8p
            description: Variant is srr8p
            value: srr8p
      - name: core
        type: select
        description: Core to Build
        ui:
          name: core
        options:
          - name: r52
            description: Core is r52
            value: r52
          - name: bbe32
            description: Core is bbe32
            value: bbe32
      - name: upload-path
        type: string
        description: |-
          The path inside of JFrog to upload the outputs to. Note - this does not include the base URL of the repository
          Ex. core_radar-aptiv-00000000-gen8_ind13400-local/reviews/45/12345/6/buildFiles
        default: $(params.upload-path)
        ui:
          name: JFrog Upload Path
      - name: cov-stream
        type: string
        description: The Coverity stream for this build, will be used to download reports
        default: ""
        ui:
          name: Coverity Stream
    results:
      - name: jf-upload-url
        description: The URL the outputs are uploaded to.
      - name: build-exit-code
        description: The exit code of the build step
      - name: upload-exit-code
        description: The exit code of the upload step
      - name: error-message
        description: A string with any new errors found
      - name: jf-upload-path
        description: The path the outputs are uploaded to.
      - name: commit-hash
        description: commit-hash
      - name: rapid-build-url
        description: URL to the RapidBuild
    steps:
      - name: shallow-clone
        task: Utils/YGGDRASIL/git-shallow-clone@0.0.3
        params:
          repository:
            depth: "1"
            git-ref: $(params.git-ref)
            password: $(secrets.gerrit-cred.password.path)
            url: https://gitgerrit.asux.aptiv.com/Core_Radar_Gen8_iND13400
            username: $(secrets.gerrit-cred.username.path)
        WhenVal: false
        returnResults:
          commitHash: commit-hash
      - name: build-code
        task: build-code
        params:
          core: $(params.core)
          git-ref: $(params.git-ref)
          repoRoot: $(cat $(steps.shallow-clone.results.repoPath.path))
          variant: $(params.variant)
          cov-stream: $(params.cov-stream)
        WhenVal: false
        returnResults:
          exit-code: build-exit-code
          error-message: error-message
          rapid-build-url: rapid-build-url
          unstable: unstable
      - name: upload-files
        task: Utils/ADVRADAR/core-radar-jfrog-upload@1.0.1
        params:
          pathToUpload: $(cat $(steps.build-code.results.outputDir.path))
          uploadPath: $(params.upload-path)coverity_$(params.variant)_$(params.core)
        WhenVal: false
        returnResults:
          exit-code: upload-exit-code
          uploadUrl: jf-upload-url
          unstable: unstable
          jf-upload-path: jf-upload-path
    wrrn: ""
  - name: build-code
    langVersion: v1
    category: build
    params:
      - name: repoRoot
        type: string
        description: Path to the root of the repo
        ui:
          name: repoRoot
      - name: variant
        type: string
        description: Variant to Build
        ui:
          name: variant
      - name: core
        type: string
        description: Core to Build
        ui:
          name: core
      - name: git-ref
        type: string
        description: The git commit hash or branch to check out from Gerrit
        default: dev
        ui:
          name: Commit Hash or Branch
      - name: cov-stream
        type: string
        description: The Coverity stream for this build, will be used to download reports
        default: ""
        ui:
          name: Coverity Stream
    results:
      - name: outputDir
        description: Path to the directory that contains the output files/folders
      - name: exit-code
        description: Exit code to provide to any downstream tasks
      - name: error-message
        description: String to hold any new issues detected.
      - name: rapid-build-url
        description: URL to the RapidBuild
      - name: unstable
    steps:
      - name: build
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/bin/bash

          # CPU=`cat /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us`
          # MEM=`cat /sys/fs/cgroup/memory/memory.limit_in_bytes | numfmt --to=iec`
          # echo "Compute Resource: $(( $CPU/100000 )) x $MEM"
          # Show storage resources for the container
          df -h

          echo "RepoRoot  = $(params.repoRoot)"
          echo "Variant   = $(params.variant)"
          echo "Core      = $(params.core)"
          echo "Git-ref   = $(params.git-ref)"

          # Path to the build event JSON file
          BUILD_EVENT_FILE="build_event.json"

          cd $(params.repoRoot)
          git config --global --add safe.directory $(params.repoRoot)
          cp $(secrets.netrc.path) ~/.netrc

          # Set up credentials for the ARB remote cache
          echo "build --bes_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" > user.bazelrc
          echo "build --remote_header=x-arb-api-key=$(cat $(secrets.arb-token.path))" >> user.bazelrc

          # commit and disable remote cache if we are on the dev branch,
          # might need to check this for the nightly job vs the post merge job
          # TODO: confirm we are not also submitting for post-merge
          commit_param=""
          remote_cache=""

          if [ "$(params.git-ref)" = "dev" ]; then
            commit_param="--config=cov_commit"
            remote_cache="--noremote_accept_cached"
          fi

          # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          # coverity file in the WRSD secrets is saved as base64 encoded
          # the below commands just decodes the file
          cp $(secrets.coverity-auth.authstring.path) ~/coverity1.auth
          base64 --decode ~/coverity1.auth > ~/coverity.auth
          chmod 600 /home/`whoami`/coverity.auth

          # ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
          # chmod +x ./bazelisk # save output directory path for user usages
          echo -n "$(params.repoRoot)/covdir" > $(results.outputDir.path)
          mkdir -p $(params.repoRoot)/covdir/$(params.variant)_$(params.core)

          pwd
          cd $(params.repoRoot)/tools/coverity
          pwd

          # Source the .bazeliskrc file manually.
          source $(params.repoRoot)/.bazeliskrc

          # Run Bazel
          bazel version

          # get the execution root path to use with --strip-path
          EXECROOT=$(bazel info execution_root)
          echo "Exec root = $EXECROOT"
          # --strip-path="$EXECROOT" is not working

          echo "----------------------------------"
          echo "Coverity Build - $(params.variant) - $(params.core)"
          echo "----------------------------------"
          bazelisk run //software/$(params.core):commit_defects --jobs=45 --config=$(params.variant) --build_event_json_file="$BUILD_EVENT_FILE" $remote_cache $commit_param -- --auth-key-file=/home/`whoami`/coverity.auth 2>&1 | tee build_output.log

          # Capture the exit status of the bazelisk command
          BAZEL_EXIT_CODE=$PIPESTATUS

          build_output=$(cat build_output.log)

          # Extract the invocation ID using jq
          INVOCATION_ID=$(grep -Po '"uuid":"\K[^"]+' build_event.json)

          # Check if the invocation ID is not empty
          if [[ -n "$INVOCATION_ID" ]]; then
              echo "Invocation ID: $INVOCATION_ID"

              # Create the RapidBuild url
              echo -n "https://rapidbuild.asux.aptiv.com/organizations/gpo/projects/core_radar_gen8_ind13400/invocations/${INVOCATION_ID}" > $(results.rapid-build-url.path)
          fi

          # Check if the build passed or failed
          if [ $BAZEL_EXIT_CODE -eq 0 ]; then
              echo "----------------------------------"
              echo "Build completed successfully."
              echo "----------------------------------"
          else
              echo "----------------------------------"
              echo "Build failed with exit code $BAZEL_EXIT_CODE."
              echo "----------------------------------"
              # Optionally, you can exit the script with a non-zero status to indicate failure
              echo -n "1" > $(results.exit-code.path)
              echo -n "Bazel Build for Coverity Failed" > $(results.error-message.path)
              echo -n "true" > $(results.unstable.path)
              exit 1
          fi

          cd $(params.repoRoot)

          compilerFolder=""

          if [[ "$(params.core)" == "r52" ]]; then
            compilerFolder="windriver_v7_cov"
          elif [[ "$(params.core)" == "bbe32" ]]; then
            compilerFolder="xtensa_bbe32_cov"
          else
            echo "Core Not Supported"
          fi

          echo "Copying Coverity Logs to output directory"
          # Copy summary logs from the output and output_combined folders to the output directory to send to jfrog
          cp  "bazel-bin/software/$(params.core)/$compilerFolder/analysis_combined/output_combined/summary.txt" "$(params.repoRoot)/covdir/$(params.variant)_$(params.core)/"
          cp  "bazel-bin/software/$(params.core)/$compilerFolder/analysis_combined/output_combined/analysis-log.txt" "$(params.repoRoot)/covdir/$(params.variant)_$(params.core)/"

          # Check for any [FATAL] line
          if echo "$build_output" | grep -q '\[FATAL\]'; then
            fatal_lines=$(echo "$build_output" | grep '\[FATAL\]')
            echo "----------------------------------"
            echo "********* FATAL ERRORS ***********"
            echo "$fatal_lines"
            echo "----------------------------------"

            echo -n "> ${fatal_lines}" > $(results.error-message.path)
            echo -n "1" > $(results.exit-code.path)
            exit 1
          elif echo "$build_output" | grep -q 'ERROR: Introduced [0-9]\+ new defects for given change:'; then
            # error_line=$(echo "$build_output" | grep -A 3 'ERROR: Introduced [0-9]\+ new defects for given change:')
            error_block=$(echo "$build_output" | awk '/ERROR: Introduced [0-9]+ new defects for given change:/,/^$/')

            echo "----------------------------------"
            echo "****** NEW ISSUES DETECTED *******"
            echo "${error_block//\'/}"
            echo "----------------------------------"

            cleaned_issue=$(echo -e "$error_block" | sed -e "s/cid='[^']\+', //; s/merge_key='[^']\+', //; s/=/:/g")
            GERRIT_CHAR_LIMIT=500

            # Shorten the Coverity results that get written to the gerrit review
            while [[ $(echo -n "$cleaned_issue" | wc -c) -gt $GERRIT_CHAR_LIMIT ]]; do
                cleaned_issue=${cleaned_issue%Issue(*}  # Remove the last full "Issue(" entry
                cleaned_issue="${cleaned_issue}..."  # Append "..." to indicate truncation
            done
            echo -n "> ${cleaned_issue}" > $(results.error-message.path)
            echo -n "2" > $(results.exit-code.path)
            exit 2
          else
            echo "----------------------------------"
            echo "No new defects were found"
            echo "----------------------------------"
            echo -n "" > $(results.error-message.path)
            echo -n "0" > $(results.exit-code.path)
          fi

          echo "----------------------------------"
          echo "Downloading Coverity Reports for High/Medium/Mandatory"
          echo "----------------------------------"

          # Set parameters
          covUser="$(cat $(secrets.netrc.coverityUser.path))"
          covPassword="$(cat $(secrets.netrc.coverityPass.path))"
          reportType="issues"
          outputFolder="$(params.repoRoot)/covdir/$(params.variant)_$(params.core)"

          # Define streamID (Modify this)
          streamID="$(params.cov-stream)"

          # Define viewIDs (Modify these)
          declare -A viewIDs
          viewIDs["142974"]="Issues_High"
          viewIDs["143277"]="Issues_Medium"
          viewIDs["143276"]="Issues_Mandatory"
          viewIDs["12190"]="All_Defects"

          # Loop through each viewID
          for viewID in "${!viewIDs[@]}"; do
              url="https://coverity.asux.aptiv.com/api/viewContents/${reportType}/v1/${viewID}?projectId=${streamID}&rowCount=-1"
              outputFile="${outputFolder}/report_${streamID}_${viewIDs[$viewID]}.csv"

              echo "Downloading report for StreamID: ${streamID}, ViewID: ${viewIDs[$viewID]}..."
              curl -k --noproxy "*" --silent --header "Accept: text/csv" -u "${covUser}:${covPassword}" "$url" -o "$outputFile"
              echo "Report saved to $outputFile"
          done

          ls -la covdir/$(params.variant)_$(params.core)
        onError: continue
        ComputeResources: {}
        SecurityContext: null
        Storage: null
        WhenVal: false

    wrrn: ""
  - name: prepare-vote-and-message
    langVersion: v1
    category: Utils
    params:
      - name: build-exit-codes
        type: map
        description: Exit codes for any build tasks
        ui:
          name: Build Exit Codes
        render:
          templateName: map
      - name: upload-exit-codes
        type: map
        description: Exit codes for any upload tasks
        ui:
          name: Upload Exit Codes
        render:
          templateName: map
      - name: error-messages
        type: map
        description: Error messages from each of the coverity jobs
        ui:
          name: Error Message
        render:
          templateName: map
    results:
      - name: vote-value
        description: Value to vote back to Gerrit
      - name: vote-message
        description: Message to write back to Gerrit
      - name: exit-code
        description: Exit code to provide to any downstream tasks
    steps:
      - name: analyze-build-codes
        script: |-
          #!/bin/bash

          CPU=`cat /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us`
          MEM=`cat /sys/fs/cgroup/memory/memory.limit_in_bytes | numfmt --to=iec`
          echo "Compute Resource: $(( $CPU/100000 )) x $MEM"
          # Show storage resources for the container
          df -h

          # Write initial "success" values
          echo -n "+1" > "$(results.vote-value.path)"
          echo -n "0" > "$(results.exit-code.path)"

          # Define paths
          BUILD_EXIT_CODES_PATH="$(params.build-exit-codes.path)"
          UPLOAD_EXIT_CODES_PATH="$(params.upload-exit-codes.path)"
          ERROR_MESSAGES_PATH="$(params.error-messages.path)"
          VOTE_MESSAGE_PATH="$(results.vote-message.path)"
          VOTE_VALUE_PATH="$(results.vote-value.path)"
          EXIT_CODE_PATH="$(results.exit-code.path)"

          # Function to fetch and clean all error messages for a given key
          get_error_message() {
            local key="$1"
            awk -v key="$key" '
              /^'"$key"':/ {flag=1; next}
              /^[A-Za-z0-9_]+:/ {flag=0}
              flag && NF {print}
            ' "$ERROR_MESSAGES_PATH" | sed -e "s/cid='[^']\+', //" -e "s/merge_key='[^']\+', //"
          }

          # Read and act on Build exit codes
          while IFS= read -r build_line <&3; do
            echo "Processing line: $build_line"
            if [[ $build_line =~ ^([[:alnum:]_]+)_([[:alnum:]_]+):[[:blank:]]*([[:digit:]]+)$ ]]; then
              variant=${BASH_REMATCH[1]}   # ${BASH_REMATCH[1]} is the variant (e.g., flr8, SRR7e, etc.)
              test_name=${BASH_REMATCH[2]} # ${BASH_REMATCH[2]} is the test name (e.g., R52, BBE32)
              exit_code=${BASH_REMATCH[3]} # ${BASH_REMATCH[3]} is the exit code (e.g., 0, 1, 2)
              key="${variant}_${test_name}"

              if [ "$exit_code" == "0" ]; then
                # Job passed
                echo "${key} Coverity Build Successful! ✔️" >> "$VOTE_MESSAGE_PATH"
              elif [ "$exit_code" == "1" ]; then
                # Job failed
                echo -n "-1" > "$VOTE_VALUE_PATH"
                echo -n "1" > "$EXIT_CODE_PATH"
                echo "${key} Coverity Build Failed! ⚠" >> "$VOTE_MESSAGE_PATH"
              elif [ "$exit_code" == "2" ]; then
                # New issues detected
                echo -n "-1" > "$VOTE_VALUE_PATH"
                echo -n "2" > "$EXIT_CODE_PATH"
                echo "${key} New Issues Detected! 🚧" >> "$VOTE_MESSAGE_PATH"

                # Extract and clean all error messages for the key
                new_issues="$(get_error_message "$key")"

                if [ -n "$new_issues" ]; then
                  echo "${new_issues}" >> "$VOTE_MESSAGE_PATH"
                else
                  echo "Warning: No detailed issue found for $key" >&2
                fi
              fi
            else
              echo "Warning: Line format not recognized: $build_line" >&2
            fi
          done 3< "$BUILD_EXIT_CODES_PATH"

          # Read and act on Upload exit codes
          while read -r line; do
            echo "Processing upload line: $line"
            if [[ $line =~ ^([[:alnum:]_]+)_([[:alnum:]_]+):[[:blank:]]*([[:digit:]]+)$ ]]; then
              variant=${BASH_REMATCH[1]}
              test_name=${BASH_REMATCH[2]}
              exit_code=${BASH_REMATCH[3]}
              key="${variant}_${test_name}"

              if [ "$exit_code" != "0" ]; then
                # If this is the first failure, clear the vote-message file
                if [ "$(cat "$EXIT_CODE_PATH")" == "0" ]; then
                  echo "" >> "$VOTE_MESSAGE_PATH"
                fi
                echo -n "-1" > "$VOTE_VALUE_PATH"
                echo -n "1" > "$EXIT_CODE_PATH"
                echo "${key} Upload Failed! ❌" >> "$VOTE_MESSAGE_PATH"
              fi
            else
              echo "Warning: Line format not recognized: $line" >&2
            fi
          done < "$UPLOAD_EXIT_CODES_PATH"
        ComputeResources: {}
        SecurityContext: null
        Storage: null
        WhenVal: false
    wrrn: ""
  - name: publish-metrics
    langVersion: v1
    category: Utils
    params:
      - name: variant
        type: select
        description: Variant to Unit Test
        ui:
          name: variant
        options:
          - name: flr8
            description: Variant is flr8
            value: flr8
