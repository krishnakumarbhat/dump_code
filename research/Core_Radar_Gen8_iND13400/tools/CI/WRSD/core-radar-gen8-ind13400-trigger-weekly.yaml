langVersion: v1
name: core-radar-gen8-ind13400-trigger-weekly
description: Pipeline that is triggered by Gerrit and then launches all downstream pipelines for the project
ui:
  name: core-radar-gen8-ind13400-trigger-weekly
params:
  - name: upload-path
    type: string
    default: core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/weekly/$(config.pipeline.runNumber)
  - name: latest-upload-path
    type: string
    default: core_radar-aptiv-00000000-gen8_ind13400-local/wrsd/ind13400/weekly/latest
  - name: change-id
    type: string
    default: ""
  - name: commit-id
    type: string
    default: dev
  - name: gerrit-url
    type: string
    default: https://gitgerrit.asux.aptiv.com
  - name: project-url-encoded
    type: string
    default: Core_Radar_Gen8_iND13400
  - name: trigger-url
    type: string
    default: $(params.trigger-url)
compute:
  - name: linux-8c32g
    resource: asp-compute-linux-8c32g
  - name: linux-2c8g
    resource: asp-compute-linux-2c8g
  - name: linux-1c4g
    resource: asp-compute-linux-1c4g
tasks:
  - name: publish-run
    task: Utils/core-radar-publish-run@0.1.1
    compute: linux-1c4g
  - name: build
    task: Utils/YGGDRASIL/custom-run@0.0.1
    compute: linux-1c4g
    params:
      project-name: $(params.project-url-encoded)
      change-id: $(params.change-id)
      commit-id: $(params.commit-id)
      gerrit-url: $(params.gerrit-url)
      parameters:
        change-id: $(params.change-id)
        commit-id: $(params.commit-id)
        gerrit-url: $(params.gerrit-url)
        project-url-encoded: $(params.project-url-encoded)
        upload-path: $(params.upload-path)/buildFiles/
      target-pipeline: core-radar-gen8-ind13400-build
      yaml_path: tools/CI/WRSD/core-radar-gen8-ind13400-build.yaml
  - name: hw-tests
    task: Utils/YGGDRASIL/custom-run@0.0.1
    compute: linux-1c4g
    params:
      project-name: $(params.project-url-encoded)
      change-id: $(params.change-id)
      commit-id: $(params.commit-id)
      gerrit-url: $(params.gerrit-url)
      parameters:
        change-id: $(params.change-id)
        commit-id: $(params.commit-id)
        gerrit-url: $(params.gerrit-url)
        project-url-encoded: $(params.project-url-encoded)
        upload-path: $(params.upload-path)/hwTests/
        download-path: $(params.upload-path)/buildFiles/
        testTimeout: "6h"
        testDuration: "14400"
        overallTimeout: "13h"
      target-pipeline: core-radar-gen8-ind13400-hw-test
      yaml_path: tools/CI/WRSD/core-radar-gen8-ind13400-hw-test.yaml

defineTasks:
  - name: compiledb
    langVersion: v1
    category: build
    params:
      - name: repoRoot
        type: string
        description: Path to the root of the repo
        ui:
          name: repoRoot
      - name: variant
        type: string
        description: Variant to Build
        ui:
          name: variant
      - name: whitelist
        type: string
        description: Comma seperated list of folders and/or files to include
        default: ""
    results:
      - name: outputDir
        description: Path to the directory that contains the output files/folders
      - name: exit-code
        description: Exit code to provide to any downstream tasks
      - name: unstable
    steps:
      - name: build
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          #!/bin/bash

          echo repoRoot = $(params.repoRoot)
          echo variant = $(params.variant)

          cd $(params.repoRoot)
          git config --global --add safe.directory $(params.repoRoot)

          cp $(secrets.netrc.path) ~/.netrc

          echo "Running Bazel command: bazelisk run //:compiledb --config=$(params.variant)"

          bazelisk run //:compiledb --config=$(params.variant)

          # Capture the exit status of the bazelisk command
          BAZEL_EXIT_CODE=$?

          # Check if the build passed or failed
          if [ $BAZEL_EXIT_CODE -eq 0 ]; then
              echo "----------------------------------"
              echo "Build completed successfully."
              echo "----------------------------------"
          else
              echo "----------------------------------"
              echo "Build failed with exit code $BAZEL_EXIT_CODE."
              echo "----------------------------------"
              # Mark this task unstable
              echo "true" > $(results.unstable.path)
              # Optionally, you can exit the script with a non-zero status to indicate failure
              exit 1
          fi

          # Check if the whitelist is empty
          if [ -z "$(params.whitelist)" ]; then
            echo "Whitelist is empty, copying all files/folders to external"
            cp -r -L external external_temp

          else
            echo "Whitelist: $(params.whitelist)"

            # Convert the whitelist into an array by replacing commas with spaces
            IFS=',' read -r -a whitelist_array <<< "$(params.whitelist)"

            # Create a temp folder to store the selected files/folders
            mkdir -p external_temp

            # Loop through the whitelist and copy each specified folder/file
            for item in "${whitelist_array[@]}"; do
              # Check if the item exists in the external directory
              if [ -e "external/$item" ]; then
                cp -r -L "external/$item" "external_temp/$item"
              else
                echo "Warning: $item does not exist in the external directory."
              fi
            done
          fi

          # remove the symbolic link
          unlink external

          # Move the temporary folder to replace the original external folder
          mv external_temp external

          echo "Whitelist files/folders have been copied."

          # save output directory path for user usages
          echo -n "$(params.repoRoot)/bazel-bin/outputs" > $(results.outputDir.path)
        onError: continue
        ComputeResources: {}
        SecurityContext: null
        Storage: null
        WhenVal: false
      - name: save-exit-code
        image: system.registry.389177498442.awsaptiv.com/aptiv-core-radar/build-format-ready:2.0
        script: |
          echo -n $(cat $(steps.build.exitCode.path)) > $(results.exit-code.path)
        ComputeResources: {}
        SecurityContext: null
        Storage: null
        WhenVal: false
    wrrn: ""
storage:
  - name: shared
    defaultMount: true
    mountPath: /volumes/shared
    readOnly: false
    resource: Perception_Radar_FLR8_storage
timeout: 24h
