{% extends "base.html" %}

{% block title %}{{ tool_name }} - HPCC Runtime Console{% endblock %}

{% block content %}
<div class="container-fluid p-0 hyperlink-viewer-shell">
    <iframe
        src="{{ url_for('hyperlink_viewer_app') }}"
        title="Hyperlink Stream Viewer"
        allow="fullscreen"
        loading="eager"></iframe>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .hyperlink-viewer-shell { height: calc(100vh - 92px); min-height: 560px; overflow: hidden; }
    .hyperlink-viewer-shell iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f6f8; }
    @media (max-width: 700px) { .hyperlink-viewer-shell { height: calc(100vh - 72px); min-height: 500px; } }
</style>
{% endblock %}
