<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            text-align: center;
            color: white;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="bi bi-bug"></i>
        </div>
        <div class="error-code">500</div>
        <h2 class="mb-4">Internal Server Error</h2>
        <p class="mb-4 opacity-75">
            The service may still be initializing. This page will retry automatically.
        </p>
        <div id="retryStatus" class="mb-3">Checking backend readiness...</div>
        <a href="/" id="dashboardLink" class="btn btn-light btn-lg disabled" aria-disabled="true">
            <i class="bi bi-house me-2"></i> Go to Dashboard
        </a>
    </div>
    <script>
    (() => {
        const status = document.getElementById('retryStatus');
        const dashboard = document.getElementById('dashboardLink');
        let attempts = 0;
        async function retry() {
            attempts += 1;
            try {
                const response = await fetch('/health', {cache: 'no-store'});
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                status.textContent = 'Backend ready.';
                dashboard.classList.remove('disabled');
                dashboard.removeAttribute('aria-disabled');
                window.setTimeout(() => window.location.assign('/login'), 300);
            } catch (error) {
                status.textContent = `Still initializing. Retrying automatically (attempt ${attempts})...`;
                window.setTimeout(retry, Math.min(10000, 1000 + attempts * 500));
            }
        }
        retry();
    })();
    </script>
</body>
</html>
